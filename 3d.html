<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b5e20">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Surface de vente 3D</title>
<style>
:root{--vert:#1b5e20;--vert2:#2e7d32;--bleu:#0d47a1;--carte:#fff;--txt:#1d2622;--doux:#5f6b66;--ligne:#e1e6e3;--fond:#dfe6e2}
@media (prefers-color-scheme:dark){:root{--carte:#1b2220;--txt:#e8eeeb;--doux:#9fb0a8;--ligne:#2a3330;--fond:#2a312e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--fond)}
header{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--vert);color:#fff;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;display:flex;align-items:center;gap:8px}
header h1{font-size:16px;margin:0;flex:1}
header a,header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;text-decoration:none}
#cmd{position:fixed;top:calc(44px + env(safe-area-inset-top));left:0;right:0;z-index:4;padding:6px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:rgba(255,255,255,.93);box-shadow:0 1px 6px rgba(0,0,0,.15)}
@media (min-width:760px){#cmd{grid-template-columns:repeat(8,1fr)}}
@media (prefers-color-scheme:dark){#cmd{background:rgba(27,34,32,.94)}}
#cmd button{border:1px solid var(--ligne);border-radius:9px;padding:7px 2px;font-size:13px;background:var(--carte);color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmd button.on{background:var(--bleu);color:#fff;border-color:var(--bleu)}
#cmd button.ed.on{background:#e65100;border-color:#e65100}
#cmd button.pan.on{background:var(--vert2);border-color:var(--vert2)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bandeau{position:fixed;left:0;right:0;z-index:3;background:#e65100;color:#fff;font-size:13px;padding:5px 10px;text-align:center;display:none}
#leg{position:fixed;left:8px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;background:rgba(255,255,255,.93);color:#1d2622;border-radius:10px;padding:6px 10px;font-size:12px;max-width:calc(100% - 16px)}
#leg.min>div{display:none}#leg.min::after{content:'Légende ▸'}
#leg .g{height:9px;border-radius:5px;margin:3px 0}
#fiche,#panneau{position:fixed;left:8px;right:8px;z-index:6;background:var(--carte);border-radius:14px;padding:12px 14px;box-shadow:0 4px 20px rgba(0,0,0,.35);overflow:auto;display:none}
#fiche{bottom:calc(8px + env(safe-area-inset-bottom));max-height:58vh}
#panneau{max-height:62vh}
@media (min-width:760px){#fiche{left:auto;width:430px}#panneau{right:auto;width:430px}}
h3{margin:0 0 6px;font-size:16px;display:flex;gap:8px;align-items:flex-start}
h3 span{flex:1}
h4{margin:10px 0 4px;font-size:14px}
.x{border:0;background:var(--ligne);border-radius:8px;padding:2px 9px;font-size:16px;color:var(--txt)}
.l{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--ligne);font-size:13.5px}
.sub{color:var(--doux);font-size:12.5px}
.verdict{margin:8px 0;padding:8px 10px;border-radius:10px;font-size:13.5px}
.v-op{background:#fff3e0;color:#7a3e00}.v-ok{background:#e8f5e9;color:#1b5e20}.v-fr{background:#e3f2fd;color:#0d47a1}
@media (prefers-color-scheme:dark){.v-op{background:#3d2a12;color:#ffcc80}.v-ok{background:#16301a;color:#a5d6a7}.v-fr{background:#132a3d;color:#90caf9}}
label{display:block;font-size:12px;color:var(--doux);margin-top:8px}
input,select{width:100%;font:inherit;font-size:15px;padding:7px 8px;border:1px solid var(--ligne);border-radius:8px;background:var(--carte);color:var(--txt)}
input[type=range]{padding:0;border:0}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.btn{border:0;border-radius:9px;padding:9px 6px;font-size:14px;background:var(--vert2);color:#fff}
.btn.s{background:var(--ligne);color:var(--txt)}.btn.r{background:#c62828}.btn.o{background:#e65100}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}
.seg button,.tg{border:1px solid var(--ligne);border-radius:8px;padding:7px 4px;font-size:13px;background:var(--carte);color:var(--txt)}
.seg button.on,.tg.on{background:var(--vert2);color:#fff;border-color:var(--vert2)}
.grille{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:4px}
#joy{position:fixed;left:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.8);z-index:4;display:none;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(27,94,32,.85)}
#msg{position:fixed;top:140px;left:50%;transform:translateX(-50%);z-index:7;background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;display:none;max-width:90%;text-align:center}
#charge{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:var(--fond);font-size:15px;color:var(--doux);flex-direction:column;gap:8px}
#charge b{display:block;width:180px;height:6px;border-radius:3px;background:var(--ligne);overflow:hidden}#charge b i{display:block;height:100%;width:0;background:var(--vert2)}
.res{max-height:34vh;overflow:auto}
.res .l{cursor:pointer}
</style>
</head>
<body>
<header><a href="index.html">← Pilotage</a><h1>Surface de vente 3D</h1><button id="aide">?</button></header>
<div id="cmd"></div>
<div id="bandeau"></div>
<canvas id="cv"></canvas>
<div id="joy"><i></i></div>
<div id="leg" onclick="this.classList.toggle('min')"></div>
<div id="panneau"></div>
<div id="fiche"></div>
<div id="msg"></div>
<div id="charge"><span>Chargement de la maquette…</span><b><i id="pc"></i></b></div>
<script type="module">
'use strict';
import * as T from './moteur3d-3.js';
const {GLTFLoader,OrbitControls,DRACOLoader,computeBoundsTree,acceleratedRaycast}=T;
T.BufferGeometry.prototype.computeBoundsTree=computeBoundsTree;T.Mesh.prototype.raycast=acceleratedRaycast;
const V3D='3.0';
const $=s=>document.querySelector(s);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const eur=v=>num(v)===null?'—':Math.round(+v).toLocaleString('fr-FR')+' €';
const URL_DEF='https://script.google.com/macros/s/AKfycbyQvb6qxIQ9Z1Ah97F7UouUwmqRiXNDCr1YLzgZ7afWpVDUKwWy8KVb32nVSwM-Z0oiyg/exec';
const cfg=()=>({url:ls.get('pil_url')||URL_DEF,code:ls.get('pil_code')||''});
function msg(t,ms){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',ms||2400)}

/* ---------- Données partagées (mêmes clés que le plan 2D) ---------- */
let D=null;try{D=JSON.parse(ls.get('pil_cache')||'null')}catch(e){}
let ETAT={};try{ETAT=JSON.parse(ls.get('pil_etat')||'{}')}catch(e){}
async function etatGet(){const c=cfg();if(!c.code)return;try{const r=await fetch(c.url,{method:'POST',body:JSON.stringify({code:c.code,action:'etat_get'})});const j=await r.json();if(j.ok){ETAT=j.etat||{};ls.set('pil_etat',JSON.stringify(ETAT));toutAppliquer()}}catch(e){}}
async function etatSet(k,v){ETAT[k]=v;ls.set('pil_etat',JSON.stringify(ETAT));const c=cfg();if(!c.code){msg('Enregistré sur cet appareil seulement (code non configuré)');return false}
  try{const r=await fetch(c.url,{method:'POST',body:JSON.stringify({code:c.code,action:'etat_set',cle:k,valeur:v})});const j=await r.json();return !!j.ok}catch(e){return false}}
const jget=k=>{try{return JSON.parse(ETAT[k]||'{}')}catch(e){return {}}};
const plan2=()=>jget('plan2'),objEtat=()=>jget('plan3d_obj'),maqEtat=()=>jget('plan3d_maq'),repEtat=()=>jget('plan3d_rep');
const _sv={};function sauverCle(k,obj,txt){ETAT[k]=JSON.stringify(obj);ls.set('pil_etat',JSON.stringify(ETAT));clearTimeout(_sv[k]);_sv[k]=setTimeout(async()=>{const ok=await etatSet(k,ETAT[k]);msg(ok?(txt||'Enregistré (visible sur tous vos appareils)'):'Gardé sur cet appareil (réseau)')},600)}

/* ---------- Réglages d'affichage (par appareil) ---------- */
const REG=Object.assign({plafond:'auto',murs:'visibles',enseignes:true,mobilier:true,coupe:5.6,fluide:false,rep:{tg:true,bacs:true,bdc:true,ecr:true,ent:true}},(()=>{try{return JSON.parse(ls.get('p3d_reg')||'{}')}catch(e){return {}}})());
const sauverReg=()=>ls.set('p3d_reg',JSON.stringify(REG));

let PLAN=null,ZON=null,GR=null,INFO=[];
const BB=[9,-39,70,2],RES=4,GW=(BB[2]-BB[0])*RES,GH=(BB[3]-BB[1])*RES;
const cellOf=(x,z)=>[Math.floor((x-BB[0])*RES),Math.floor((z-BB[1])*RES)];
function marchable(x,z){if(!GR)return true;const [i,j]=cellOf(x,z);if(i<0||j<0||i>=GW||j>=GH)return false;return GR.walk[j*GW+i]>0}
function passage(x,z){if(!GR)return null;const [i,j]=cellOf(x,z);let b=0;for(let dj=-2;dj<=2;dj++)for(let di=-2;di<=2;di++){const ii=i+di,jj=j+dj;if(ii>=0&&jj>=0&&ii<GW&&jj<GH)b=Math.max(b,GR.pass[jj*GW+ii])}return b/255}

/* Marge par laboratoire (même rapprochement que le plan 2D) */
const MOTS_VIDES=new Set('BEBE HYGIENE INTIME SOINS SOIN DIVERS PROMOTION SAISONNIER SAISONNIERS LIBRE ACCES BIO LAIT HOMME FEMME CORPORELLE LAVANT SAVON SAVONS BACS SOLDEURS FORMAT VOYAGE LEVRES MAINS NATUREL DENTAIRE ACCESSOIRES GROS VOLUME MATERNITE SERUM TEST PREMIERS DENTS NUTRI DERMATO DERMATOLOGIE MAQUILLAGE SOLAIRE CHANGE COUCHES LINGETTES STRESS SOMMEIL SPORT PATCHS TONUS DIGESTION AMPOULE MINCEUR DIETETIQUE PANSEMENT PILULIER ORTHOPEDIE CONTENTION CHAUSSURES INCONTINENCE RENUTRITION VETERINAIRE PODOLOGIE DENTIFRICES DEODORANTS CEREALES TISANES VRAC ARTICULATION CIRCU MAGNESIUM PHYTO AROMA HERBORISTERIE ANTIGASPI SKIN GROSSESSES ALLAITEMENT PRESERVATIFS SERVIETTE'.split(' '));
const ALIAS={TOPICREM:'LABORATOIRES NIGY',ATTIER:'PIERRE CATTIER',CATTIER:'PIERRE CATTIER',GRANIONS:'EA PHARMA',BACH:'RESCUE',MUSTELA:'EXPANSCIENCE',DERCOS:'VICHY',ARKOGELULES:'ARKOPHARMA',AVENT:'PHILIPS AVENT',SCHOLL:'SCHOLL',GIBAUD:'GIBAUD'};
const norm=s=>String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/LA R POSAY/,'LA ROCHE POSAY').replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
let LABS=null;
function margeLab(nom){if(!D||!D.labos)return null;if(!LABS)LABS=D.labos.map(z=>({n:norm(z['Laboratoire']),m:num(z['Marge € 12 mois'])||0}));
  const L=norm(nom);if(L.length<3)return null;const vus=new Map();const pr=x=>{if(x&&!vus.has(x.n))vus.set(x.n,x.m)};
  pr(LABS.find(z=>z.n.startsWith(L)));
  if(!vus.size)L.split(' ').filter(w=>w.length>=4&&!MOTS_VIDES.has(w)).forEach(w=>{const a=ALIAS[w];if(a){pr(LABS.find(z=>z.n.startsWith(a)));return}pr(LABS.find(z=>z.n.startsWith(w+' ')||z.n===w)||LABS.find(z=>(' '+z.n+' ').includes(' '+w+' ')))});
  return vus.size?[...vus.values()].reduce((s,v)=>s+v,0):null}

/* ---------- Scène et rendu ---------- */
const cv=$('#cv');let R;
try{R=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'})}catch(e){$('#charge').innerHTML='Votre appareil ne peut pas afficher la 3D (WebGL indisponible). Le plan 2D reste disponible dans Pilotage.';throw e}
R.outputColorSpace=T.SRGBColorSpace;R.localClippingEnabled=true;
const PR_MAX=()=>REG.fluide?1:Math.min(devicePixelRatio||1,1.75);let prBas=false;
function resolution(bas){if(bas===prBas)return;prBas=bas;R.setPixelRatio(bas?Math.min(1,PR_MAX()):PR_MAX());taille()}
R.setPixelRatio(PR_MAX());
const S=new T.Scene();S.background=new T.Color(0xdfe6e2);
const cam=new T.PerspectiveCamera(55,1,0.1,400);
S.add(new T.HemisphereLight(0xffffff,0x9a9f9c,2.2));const sol=new T.DirectionalLight(0xffffff,1.0);sol.position.set(20,40,10);S.add(sol);
const ctl=new OrbitControls(cam,cv);ctl.enableDamping=true;ctl.dampingFactor=.12;
let sale=true;const salir=()=>{sale=true};ctl.addEventListener('change',salir);
/* résolution dynamique : plus basse pendant le mouvement, pleine à l'arrêt (technique standard des visionneuses 3D) */
let _finMvt=null;ctl.addEventListener('start',()=>{clearTimeout(_finMvt);resolution(true)});ctl.addEventListener('end',()=>{clearTimeout(_finMvt);_finMvt=setTimeout(()=>{resolution(false);salir()},350)});
function taille(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();salir()}addEventListener('resize',()=>{taille();placerVue()});taille();
const C={x:(BB[0]+56)/2,z:-22};
const COUPE=new T.Plane(new T.Vector3(0,-1,0),5.6);

const groupes={};const G=n=>{if(!groupes[n]){groupes[n]=new T.Group();groupes[n].name=n;S.add(groupes[n])}return groupes[n]};
let MAQ=null;const OBJM=new Map(); // id → {node,info,base:{x,z,r}}

function etiquette(txt,{taille=.45,fond='rgba(255,255,255,.92)',coul='#1d2622',gras=true}={}){
  const c=document.createElement('canvas'),x=c.getContext('2d'),f=(gras?'700 ':'500 ')+'44px -apple-system,Segoe UI,Roboto,sans-serif';x.font=f;const w=Math.ceil(x.measureText(txt).width)+28;c.width=w;c.height=64;
  x.font=f;x.fillStyle=fond;x.beginPath();x.roundRect?x.roundRect(0,0,w,64,14):x.rect(0,0,w,64);x.fill();x.fillStyle=coul;x.textBaseline='middle';x.fillText(txt,14,34);
  const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.minFilter=T.LinearFilter;
  const s=new T.Sprite(new T.SpriteMaterial({map:t,depthTest:false,transparent:true}));s.scale.set(taille*w/64,taille,1);s.renderOrder=10;return s}

/* ---------- Maquette : affichage par catégorie, coupe, murs ---------- */
const PLAFONDS=['plafonds','technique'];
let MAT_MURS=[];
function plafondVisible(){return REG.plafond==='oui'||(REG.plafond==='auto'&&mode==='visite')}
function appliquerMaquette(){if(!MAQ)return;const E=maqEtat();
  for(const [id,o] of OBJM){const e=E[id]||{};let v=!e.del&&!e.cache;
    if(PLAFONDS.includes(id))v=v&&plafondVisible();
    else if(id==='murs')v=v&&REG.murs!=='masques';
    else if(id==='enseignes')v=v&&REG.enseignes;
    else if(o.info.cat==='meuble'||o.info.cat==='objet')v=v&&REG.mobilier;
    o.node.visible=v;
    if(o.info.cat==='meuble'||o.info.cat==='objet'||o.copie){o.node.position.set(e.x??o.base.x,0,e.z??o.base.z);o.node.rotation.y=((e.r??0))*Math.PI/180}}
  MAT_MURS.forEach(m=>{const t=REG.murs==='transparents';m.transparent=t;m.opacity=t?.22:1;m.depthWrite=!t;m.needsUpdate=true});
  COUPE.constant=REG.coupe;majCopies();majSel();salir()}
/* Copies (éléments dupliqués) */
function majCopies(){const E=maqEtat();
  for(const [id,o] of [...OBJM])if(o.copie&&(!E[id]||E[id].del)){o.node.parent&&o.node.parent.remove(o.node);OBJM.delete(id)}
  for(const [id,e] of Object.entries(E)){if(!e.copie_de||e.del||OBJM.has(id))continue;const src=OBJM.get(e.copie_de);if(!src)continue;
    const n=src.node.clone();n.traverse(m=>{m.userData={type:'maq',id}});n.userData={type:'maq',id};MAQ.add(n);
    OBJM.set(id,{node:n,info:Object.assign({},src.info,{id,nom:e.nom||src.info.nom+' (copie)'}),base:{x:e.x,z:e.z,r:0},copie:true});n.position.set(e.x,0,e.z);n.rotation.y=(e.r||0)*Math.PI/180;n.visible=REG.mobilier}}
const nomObj=id=>{const o=OBJM.get(id);const e=maqEtat()[id]||{};return e.nom||(o?o.info.nom:id)};

/* ---------- Couches d'analyse ---------- */
const COUCHES=[['univers','🎨 Univers'],['passage','🚶 Passage'],['marge','🔥 Marge'],['reperes','📍 Repères'],['labos','🏷️ Labos'],['notes','📝 Notes'],['bf','🖤 Black Friday'],['objets','🧩 Objets posés']];
let actives=(()=>{try{return JSON.parse(ls.get('p3d_couches')||'null')||['univers','reperes']}catch(e){return ['univers','reperes']}})();
let mode='dessus',edition=false,panneau=null;
function barre(){
  const m=[['dessus','⬆ Dessus'],['survol','🌀 Survol'],['visite','🚶 Visite']];
  $('#cmd').innerHTML=m.map(([k,t])=>`<button class="${mode===k?'on':''}" data-m="${k}">${t}</button>`).join('')+`<button class="ed ${edition?'on':''}" data-a="edit">✏️ Modifier</button>`+
   [['maq','🧱 Maquette'],['ana','🗺️ Analyses'],['rep','📍 Repères'],['ajout','＋ Ajouter']].map(([k,t])=>`<button class="pan ${panneau===k?'on':''}" data-p="${k}">${t}</button>`).join('');
  $('#cmd').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(b.dataset.m){changerMode(b.dataset.m);return}
    if(b.dataset.a==='edit'){basculerEdition();return}
    const p=b.dataset.p;if(p==='ajout'){fermerPanneau();ficheAjout();return}
    if(panneau===p)fermerPanneau();else ouvrirPanneau(p)});
  placerVue()}
function placerVue(){const h=$('#cmd').getBoundingClientRect().bottom;$('#msg').style.top=(h+(edition?34:8))+'px';$('#panneau').style.top=(h+6+(edition?28:0))+'px';const b=$('#bandeau');b.style.top=h+'px'}
function basculerEdition(){edition=!edition;sel=null;selRep=null;fermer();const b=$('#bandeau');b.style.display=edition?'block':'none';
  b.textContent='✏️ Mode modification : touchez un meuble, un plafond, un mur ou un repère. Pour déplacer : touchez-le puis faites-le glisser.';
  if(edition&&!actives.includes('reperes')){actives.push('reperes');appliquerCouches()}barre();majSel()}
function fermerPanneau(){panneau=null;$('#panneau').style.display='none';barre();appliquerCouches()}
function ouvrirPanneau(p){panneau=p;$('#fiche').style.display='none';const P=$('#panneau');P.style.display='block';$('#leg').style.display='none';barre();remplirPanneau()}
const tg=(k,on,t)=>`<button class="tg ${on?'on':''}" data-t="${k}">${t}</button>`;
const seg=(k,val,opts)=>`<div class="seg">${opts.map(([v,t])=>`<button class="${val===v?'on':''}" data-s="${k}" data-v="${v}">${t}</button>`).join('')}</div>`;
function remplirPanneau(){const P=$('#panneau');let h='';
  if(panneau==='maq'){h=`<h3><span>🧱 Maquette</span><button class="x">✕</button></h3>
   <label>Plafond (dalles de la réserve, gaines, clims)</label>${seg('plafond',REG.plafond,[['auto','Auto'],['oui','Affiché'],['non','Masqué']])}
   <div class="sub">Auto : masqué vu d'en haut, affiché quand vous marchez dans le magasin (vue « maison de poupée »).</div>
   <label>Murs, cloisons et vitrines</label>${seg('murs',REG.murs,[['visibles','Visibles'],['transparents','Transparents'],['masques','Masqués']])}
   <label>Hauteur de coupe : <b id="vc">${REG.coupe>=5.5?'tout':REG.coupe.toFixed(1).replace('.',',')+' m'}</b></label>
   <input type="range" id="coupe" min="0.6" max="5.6" step="0.1" value="${REG.coupe}">
   <div class="seg">${[[5.6,'Tout'],[2.3,'Sous le plafond'],[1.3,'Plan à 1,30 m']].map(([v,t])=>`<button class="${Math.abs(REG.coupe-v)<.05?'on':''}" data-c="${v}">${t}</button>`).join('')}</div>
   <label>Afficher</label><div class="grille">${tg('enseignes',REG.enseignes,'🪧 Enseignes')}${tg('mobilier',REG.mobilier,'🗄️ Meubles')}</div>
   <label>Fluidité</label>${seg('fluide',REG.fluide?'1':'0',[['0','Image nette'],['1','Priorité fluidité']])}`}

let SOLTEX=null,SOLCV=null;
async function construireChemins(){let Cm=null;try{Cm=await (await fetch('chemins-1.json')).json()}catch(e){return}
  const g=G('sol');const geo=new T.ConeGeometry(.32,.9,3);geo.rotateX(Math.PI/2);

    for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]);const n=Math.max(1,Math.round(d/1.6));
      for(let j=0;j<n;j++){const t=(j+.5)/n,x=a[0]+(b[0]-a[0])*t,z=a[1]+(b[1]-a[1])*t;const c=new T.Mesh(geo,mt);c.position.set(x,.12,z);c.lookAt(b[0],.12,b[1]);c.renderOrder=3;c.raycast=()=>{};g.add(c)}}})

function construireSol(){SOLCV=document.createElement('canvas');SOLCV.width=GW;SOLCV.height=GH;SOLTEX=new T.CanvasTexture(SOLCV);SOLTEX.colorSpace=T.SRGBColorSpace;SOLTEX.magFilter=T.LinearFilter;
  const geo=new T.PlaneGeometry(BB[2]-BB[0],BB[3]-BB[1]);geo.rotateX(-Math.PI/2);
  const m=new T.Mesh(geo,new T.MeshBasicMaterial({map:SOLTEX,transparent:true,depthWrite:false,opacity:.85}));m.position.set((BB[0]+BB[2])/2,.05,(BB[1]+BB[3])/2);m.renderOrder=2;m.raycast=()=>{};G('sol').add(m)}
const ramp=(Sx,t)=>{for(let i=1;i<Sx.length;i++)if(t<=Sx[i][0]){const u=(t-Sx[i-1][0])/(Sx[i][0]-Sx[i-1][0]),a=Sx[i-1][1],b=Sx[i][1];return a.map((v,k)=>Math.round(v+(b[k]-v)*u))}return Sx[Sx.length-1][1]};
const R_MARGE=[[0,[33,102,172]],[.35,[103,169,207]],[.55,[254,224,139]],[.75,[244,109,67]],[1,[178,24,43]]];
let MARGEF=null;
function calculMarge(){if(MARGEF!==null)return MARGEF;MARGEF=false;if(!D||!D.labos)return MARGEF;const cnt={};ZON.L.forEach(x=>{const k=x[0].toUpperCase();cnt[k]=(cnt[k]||0)+1});
  const pts=ZON.L.map(x=>{const m=margeLab(x[0]);return {x:x[1][0],y:x[1][1],w:m===null?null:m/cnt[x[0].toUpperCase()]}}).filter(p=>p.w!==null);
  const f=new Float32Array(GW*GH),g=new Float32Array(GW*GH),s2=2*2.2*2.2;
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const X=BB[0]+(i+.5)/RES,Y=BB[1]+(j+.5)/RES;let a=0,b=0;for(const p of pts){const dx=X-p.x,dy=Y-p.y,d=dx*dx+dy*dy;if(d>36)continue;const k=Math.exp(-d/s2);a+=k*p.w;b+=k}f[j*GW+i]=a;g[j*GW+i]=b}
  const v=pts.map(p=>{const [i,j]=cellOf(p.x,p.y);return f[Math.max(0,Math.min(GH-1,j))*GW+Math.max(0,Math.min(GW-1,i))]}).sort((a,b)=>a-b);
  MARGEF={f,g,hi:v[Math.floor(v.length*.9)]||1,lo:v[Math.floor(v.length*.1)]||0};return MARGEF}
function margeEn(x,z){const M=calculMarge();if(!M)return null;const [i,j]=cellOf(x,z);if(i<0||j<0||i>=GW||j>=GH)return null;const q=j*GW+i;if(M.g[q]<.05)return null;return Math.max(0,Math.min(1,(M.f[q]-M.lo)/((M.hi-M.lo)||1)))}
function peindreSol(k){const x=SOLCV.getContext('2d'),im=x.createImageData(GW,GH);
  if(k==='passage'&&GR){for(let q=0;q<GW*GH;q++){if(!GR.walk[q]){im.data[q*4+3]=0;continue}const t=GR.pass[q]/255,c=t>=.6?[229,57,53]:t>=.3?[251,192,45]:[144,202,249];im.data[q*4]=c[0];im.data[q*4+1]=c[1];im.data[q*4+2]=c[2];im.data[q*4+3]=t>=.3?170:110}}
  if(k==='marge'){const M=calculMarge();if(M)for(let q=0;q<GW*GH;q++){const pres=Math.min(1,M.g[q]*1.4);if(pres<.04){im.data[q*4+3]=0;continue}const t=Math.max(0,Math.min(1,(M.f[q]-M.lo)/((M.hi-M.lo)||1)));const c=ramp(R_MARGE,t);im.data[q*4]=c[0];im.data[q*4+1]=c[1];im.data[q*4+2]=c[2];im.data[q*4+3]=Math.round(210*Math.pow(pres,.7))}}
  x.putImageData(im,0,0);SOLTEX.needsUpdate=true;salir()}

function ficheDeplacer(){if(!ZON||!GR){ouvrir('<h3><span>À déplacer</span><button class="x">✕</button></h3><div class="sub">Plan pas encore chargé.</div>');return}

  const P={};REP.filter(r=>r.t==='labo'&&!r.del).forEach(r=>{const n=r.nom,m=margeLab(n),p=passAllee(r.x,r.z);if(m===null||p===null)return;const k=norm(n);const o=P[k]||(P[k]={n,m,pmax:0,nb:0});o.pmax=Math.max(o.pmax,p);o.nb++});
  const L=Object.values(P);if(!L.length){ouvrir('<h3><span>À déplacer</span><button class="x">✕</button></h3><div class="sub">Aucune étiquette rapprochée des ventes (ouvrez Pilotage une fois pour charger les marges).</div>');return}
  const ms=L.map(x=>x.m).sort((a,b)=>a-b),q=f=>ms[Math.min(ms.length-1,Math.floor(f*ms.length))],haut=q(.75),bas=q(.25),e=v=>Math.round(v).toLocaleString('fr-FR')+' €',pc=v=>Math.round(v*100)+' %';
  const caches=L.filter(x=>x.m>=haut&&x.pmax<.30).sort((a,b)=>b.m-a.m).slice(0,12),chauds=L.filter(x=>x.m<=bas&&x.pmax>=.55).sort((a,b)=>a.m-b.m).slice(0,12);
  const li=x=>`<div class="l"><span>${esc(x.n)}</span><b>${e(x.m)} · passage ${pc(x.pmax)}</b></div>`;
  ouvrir(`<h3><span>🔁 À déplacer : marge × passage</span><button class="x">✕</button></h3>
   <div class="sub">${L.length} laboratoires repérés sur le plan et rapprochés des ventes (marge 12 mois Vindilis). Passage = <b>estimation</b> par le chemin le plus court entrée → comptoirs (pas un comptage).</div>
   <h4>📣 Rentables mais cachés (${caches.length})</h4><div class="sub">Dans le quart des laboratoires qui margent le plus, mais placés où passent peu de clients (moins de 30 %). À rapprocher de l'allée principale, ou à annoncer (écran, tête de gondole).</div>${caches.map(li).join('')||'<div class="sub">Aucun.</div>'}
   <h4>⚠️ Places chaudes peu rentables (${chauds.length})</h4><div class="sub">Dans le quart qui marge le moins, mais sur un passage fort (55 % et plus). Places à proposer aux laboratoires ci-dessus.</div>${chauds.map(li).join('')||'<div class="sub">Aucune.</div>'}
   <div class="sub" style="margin-top:8px">Proposition à valider par vous. Chaque déplacement fait : noter la date, puis comparer les ventes du laboratoire 4 semaines avant / 4 semaines après.</div>`)}

function ficheEcrans(){let L=[];try{L=JSON.parse(ETAT.ecr_liste||'[]')}catch(e){}const E=objEtat(),idOf=k=>'ecr_'+String(k).replace(/[^A-Za-z0-9]/g,'_');
  if(!L.length){ouvrir('<h3><span>📺 Écrans</span><button class="x">✕</button></h3><div class="sub">Ouvrez une fois l\'application › Clients › Médias › Écrans pour charger la liste de vos écrans, puis revenez ici.</div>');return}
  ouvrir(`<h3><span>📺 Vos écrans (${L.length})</span><button class="x">✕</button></h3><div class="sub">Touchez « Placer », puis touchez le sol à l'endroit exact de l'écran. Ensuite, touchez l'écran dans la 3D pour le déplacer, le tourner, changer sa hauteur ou le retirer.</div>
   ${L.map(([k,n])=>{const o=E[idOf(k)],ok=o&&!o.del;return `<div class="l"><span>${ok?'✅':'⬜'} ${esc(n)}</span><button class="btn s" data-pe="${esc(k)}" style="padding:4px 10px">${ok?'Déplacer':'Placer'}</button></div>`}).join('')}`);
  document.querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>{const k=b.dataset.pe,n=(L.find(x=>x[0]===k)||[k,k])[1],id=idOf(k);$('#fiche').style.display='none';msg('Touchez le sol à l\'emplacement de « '+n+' »',3500);
    attente=async(x,z)=>{const o=objEtat()[id]||{};sauverObj(id,{t:'ecran',lib:n,x:+x.toFixed(2),z:+z.toFixed(2),h:o.h||1.9,r:o.r||0,del:0});
      let P={};try{P=JSON.parse(ETAT.ecr_pos||'{}')}catch(e){}const u=universEn(x,z);P[k]=`Placé sur la 3D${u?' : '+u:''} (x ${x.toFixed(1)} ; z ${z.toFixed(1)})`;await etatSet('ecr_pos',JSON.stringify(P));ficheEcrans()}})}
const dans=(p,x,y)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)c=!c}return c};
function universEn(x,z){let best=null,bd=1.2;ZON.U.forEach(([c,p])=>{if(dans(p,x,z)){best=c;bd=0;return}const cx=p.reduce((s,q)=>s+q[0],0)/p.length,cz=p.reduce((s,q)=>s+q[1],0)/p.length;
  const d=Math.min(...p.map(q=>Math.hypot(q[0]-x,q[1]-z)),Math.hypot(cx-x,cz-z));if(d<bd){bd=d;best=c}});return best?ZON.couleurs[best]:null}
function ficheLieu(x,z,k,id){
  if(!k){let bd=2.2;REP.forEach(r=>{if(r.del||r.t==='labo')return;const d=Math.hypot(r.x-x,r.z-z);if(d<bd){bd=d;k=r.k}})}
  const r=k?REP.find(q=>q.k===k):null;if(r){x=r.x;z=r.z}
  const labs=[];REP.forEach(q=>{if(q.t!=='labo'||q.del)return;const d=Math.hypot(q.x-x,q.z-z);if(d<2.6&&!labs.find(l=>l.n===q.nom))labs.push({n:q.nom,d,m:margeLab(q.nom)})});labs.sort((a,b)=>(b.m||0)-(a.m||0));
  const p=passage(x,z),mg=margeEn(x,z),u=universEn(x,z);
  let v='';if(p!==null){const fort=p>=.55,faible=p<.25;
    if(fort&&(mg===null||mg<.4))v=`<div class="verdict v-op">⚠️ <b>Emplacement chaud, peu exploité</b> : beaucoup de passage, peu de marge ici. C'est l'endroit pour un laboratoire qui marge bien, une promotion ou un bac. À mesurer avant / après (ventes des produits posés, 4 semaines).</div>`;
    else if(fort)v=`<div class="verdict v-ok">✅ <b>Emplacement chaud et rentable</b> : passage fort et marge élevée. Garder, réassortir en priorité, ne jamais laisser de trou.</div>`;
    else if(faible&&mg!==null&&mg>=.6)v=`<div class="verdict v-fr">📣 <b>Rentable mais caché</b> : la marge est là mais peu de clients passent. L'annoncer : écran, flèche au sol, rappel en tête de gondole sur l'allée principale.</div>`;
    else if(faible)v=`<div class="verdict v-fr">❄️ <b>Zone froide</b> : peu de passage. Y mettre des produits de destination (que le client vient chercher exprès) plutôt que de l'achat d'impulsion.</div>`}
  const a=k?(plan2()[k]||{}):{};const titre=r?r.nom:(id&&!['sol','murs','plafonds','technique','divers'].includes(id)?nomObj(id):'Point du magasin');
  ouvrir(`<h3><span>${esc(titre)}</span><button class="x">✕</button></h3>
   <div class="l"><span>Univers</span><b>${esc(u||'—')}</b></div>
   <div class="l"><span>Passage estimé</span><b>${p===null?'—':Math.round(p*100)+' / 100'}</b></div>
   <div class="l"><span>Marge des labos autour</span><b>${mg===null?'—':Math.round(mg*100)+' / 100'}</b></div>${v}
   ${labs.length?`<div class="sub" style="margin-top:6px">Laboratoires à moins de 2,5 m (marge 12 mois, Vindilis)</div>`+labs.slice(0,8).map(l=>`<div class="l"><span>${esc(l.n)}</span><b>${eur(l.m)}</b></div>`).join(''):''}
   ${k?`<label>Ce qu'il y a dessus</label><input id="fq" value="${esc(a.quoi||'')}"><label>Promotion en cours</label><input id="fp" value="${esc(a.promo||'')}"><label>Note</label><input id="fn" value="${esc(a.note||'')}">`:''}
   <div class="btns" style="grid-template-columns:1fr 1fr">${k?'<button class="btn" id="fsv">Enregistrer</button>':''}<button class="btn o" id="fed" ${k?'':'style="grid-column:1/-1"'}>✏️ Corriger cet élément</button></div>`);
  const b=$('#fsv');if(b)b.onclick=async()=>{const E=plan2(),v2={...(E[k]||{}),quoi:$('#fq').value.trim(),promo:$('#fp').value.trim(),note:$('#fn').value.trim()};if(Object.values(v2).some(Boolean))E[k]=v2;else delete E[k];
    b.disabled=true;const ok=await etatSet('plan2',JSON.stringify(E));msg(ok?'Enregistré':'Gardé sur cet appareil (réseau)');majNotes();fermer()};
  $('#fed').onclick=()=>{if(!edition)basculerEdition();if(r){selRep=r;sel=null;majSel();ficheRepere(r)}else if(id){sel=id;selRep=null;majSel();ficheMaq(id)}else{ficheCorrections()}}}
function ficheObjet(o){if(!o)return;ouvrir(`<h3><span>${esc(o.lib||TYPES[o.t]||o.t)}</span><button class="x">✕</button></h3><div class="sub">${esc(TYPES[o.t]||o.t)}${o.bf?' · Black Friday':''}</div>
  <label>Libellé</label><input id="ol" value="${esc(o.lib||'')}">
  <div class="btns"><button class="btn" id="odep">📍 Déplacer</button><button class="btn s" id="orot">↻ 45°</button><button class="btn r" id="odel">Retirer</button>
  <button class="btn s" id="obas">⬇ Plus bas</button><button class="btn s" id="ohaut">⬆ Plus haut</button><button class="btn s" id="ook">OK</button></div>`);
  $('#ol').onchange=e=>sauverObj(o.id,{lib:e.target.value});
  $('#odep').onclick=()=>{$('#fiche').style.display='none';msg('Touchez le sol à l\'endroit voulu',3000);attente=(x,z)=>{sauverObj(o.id,base(o,{x:+x.toFixed(2),z:+z.toFixed(2)}));o=OBJ.find(q=>q.id===o.id);selPose=o;majObjets();ficheObjet(o)}};
  $('#orot').onclick=()=>{sauverObj(o.id,base(o,{r:((o.r||0)+45)%360}));o=OBJ.find(q=>q.id===o.id)};
  $('#obas').onclick=()=>{sauverObj(o.id,base(o,{h:Math.max(.1,+(o.h-.2).toFixed(2))}));o=OBJ.find(q=>q.id===o.id)};
  $('#ohaut').onclick=()=>{sauverObj(o.id,base(o,{h:+(o.h+.2).toFixed(2)}));o=OBJ.find(q=>q.id===o.id)};
  $('#odel').onclick=()=>{sauverObj(o.id,o.bf?{del:1}:Object.assign(base(o,{}),{del:1}));fermer()};$('#ook').onclick=fermer}
const base=(o,p)=>Object.assign({t:o.t,lib:o.lib,x:o.x,z:o.z,h:o.h,r:o.r||0},p);
function ficheAjout(){ouvrir(`<h3><span>＋ Ajouter</span><button class="x">✕</button></h3>
  <div class="btns" style="grid-template-columns:1fr 1fr;margin-top:0"><button class="btn s" id="arep">📍 Un repère (TG, bacs…)</button><button class="btn s" id="acor">🧾 Corrections / rechercher</button></div>
  <label>Ou poser un objet : type</label><select id="at">${AJOUTABLES.map(t=>`<option value="${t}">${TYPES[t]}</option>`).join('')}</select>
  <label>Libellé (laboratoire, thème…)</label><input id="al" placeholder="Ex. : Kakémono Avène"><div class="btns"><button class="btn" id="aok" style="grid-column:1/-1">Choisir l'emplacement</button></div>
  <div class="sub">Pour copier un vrai meuble de la maquette (une gondole, un bac) : ✏️ Modifier, touchez le meuble, puis « Dupliquer ».</div>`);
  $('#arep').onclick=ficheAjoutRepere;$('#acor').onclick=ficheCorrections;
  $('#aok').onclick=()=>{const t=$('#at').value,lib=$('#al').value.trim()||TYPES[t];$('#fiche').style.display='none';msg('Touchez le sol à l\'endroit voulu',3000);
    attente=(x,z)=>{const id='o'+Date.now().toString(36);const h={geant:2.6,ballons8:2,grappe:2,affiche:1.6,banderole:2.2,ecran:1.9,note:1.2}[t]||1;if(!actives.includes('objets')){actives.push('objets');ls.set('p3d_couches',JSON.stringify(actives))}sauverObj(id,{t,lib,x:+x.toFixed(2),z:+z.toFixed(2),h,r:0});selPose=OBJ.find(o=>o.id===id);majObjets();ficheObjet(selPose)}}}

$('#aide').onclick=()=>ouvrir(`<h3><span>Mode d'emploi (3D v${V3D})</span><button class="x">✕</button></h3>
 <div class="sub" style="font-size:13.5px">
 <p><b>⬆ Dessus</b> : le plan vu du plafond (un doigt pour glisser, deux pour zoomer). <b>🌀 Survol</b> : tourner autour. <b>🚶 Visite</b> : marcher dans le magasin (pouce gauche pour avancer, glisser ailleurs pour regarder, double-touche au sol pour y aller ; ordinateur : flèches ou Z Q S D).</p>
 <p><b>🧱 Maquette</b> : plafond (Auto = masqué vu d'en haut, affiché en visite), murs visibles / transparents / masqués, hauteur de coupe pour voir à l'intérieur des pièces, enseignes, meubles.</p>

/* ---------- Chargement ---------- */
async function lireGrille(){const img=new Image();img.src='grille.png?v=1';await img.decode();const c=document.createElement('canvas');c.width=GW;c.height=GH;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const d=x.getImageData(0,0,GW,GH).data;
  const pass=new Uint8Array(GW*GH),walk=new Uint8Array(GW*GH);for(let q=0;q<GW*GH;q++){pass[q]=d[q*4];walk[q]=d[q*4+1]>127?1:0}GR={pass,walk}}
function preparerMaquette(sc){MAQ=sc;const cache=new Map();
  const conv=(m,geo,id)=>{const k=m.uuid+(geo.attributes.color?'c':'')+(id==='murs'?'m':'');if(cache.has(k))return cache.get(k);
    const n=new T.MeshLambertMaterial({color:m.color,map:m.map||null,vertexColors:!!geo.attributes.color,flatShading:!geo.attributes.normal,side:T.DoubleSide,clippingPlanes:[COUPE]});
    if(id==='murs')MAT_MURS.push(n);cache.set(k,n);return n};
  sc.children.slice().forEach(node=>{const id=node.name,info=INFO.find(i=>i.id===id)||{id,nom:(node.userData&&node.userData.nom)||id,cat:(node.userData&&node.userData.cat)||'objet'};
    node.userData={type:'maq',id};node.traverse(m=>{if(m.isMesh){m.material=conv(m.material,m.geometry,id);m.userData={type:'maq',id}}});
    OBJM.set(id,{node,info,base:{x:node.position.x,z:node.position.z,r:0}})});
  /* arbres de recherche (BVH) construits en tâche de fond : la sélection devient instantanée */
  const L=[];sc.traverse(m=>{if(m.isMesh)L.push(m.geometry)});let i=0;const pas=()=>{const t=performance.now();while(i<L.length&&performance.now()-t<12){try{L[i].computeBoundsTree()}catch(e){}i++}if(i<L.length)setTimeout(pas,0)};setTimeout(pas,300)}
function toutAppliquer(){majCopies();appliquerMaquette();majReperes();majObjets();majNotes()}
async function demarrer(){
  const [p,z,inf]=await Promise.all([fetch('plan.json').then(r=>r.json()),fetch('zoning.json').then(r=>r.json()),fetch('maquette.json?v=3').then(r=>r.json()),lireGrille().catch(()=>{})]);PLAN=p;ZON=z;INFO=inf;
  const ld=new GLTFLoader();const dr=new DRACOLoader();dr.setDecoderPath('./');ld.setDRACOLoader(dr);
  const g=await new Promise((ok,ko)=>ld.load('maquette.glb?v=3',ok,e=>{if(e.total)$('#pc').style.width=Math.round(e.loaded/e.total*100)+'%'},ko));
  preparerMaquette(g.scene);S.add(MAQ);
  construireUnivers();construireSol();construireChemins();toutAppliquer();
  $('#charge').style.display='none';barre();changerMode('dessus');appliquerCouches();etatGet()}
let t0=performance.now();
function boucle(t){const dt=Math.min(.12,(t-t0)/1000);t0=t;if(mode==='visite'){avancer(dt);if(t-(boucle.l||0)>300){boucle.l=t;['reperes','notes','labos'].forEach(n=>{if(groupes[n])groupes[n].children.forEach(o=>{o.visible=o.position.distanceTo(cam.position)<(n==='labos'?6:11)})})}}else ctl.update();if(sale){R.render(S,cam);sale=false}requestAnimationFrame(boucle)}
requestAnimationFrame(boucle);window.__d={cam,ctl,vis,OBJM,REG,S,R,get sel(){return sel},maqEtat,repEtat,changerMode,basculerEdition,appliquerMaquette,ficheCorrections,ficheMaq,ouvrirPanneau};
demarrer().catch(e=>{$('#charge').innerHTML='Impossible de charger la maquette : '+esc(e.message||e)});
