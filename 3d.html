<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b5e20">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Surface de vente 3D</title>
<style>
:root{--vert:#1b5e20;--vert2:#2e7d32;--carte:#fff;--txt:#1d2622;--doux:#5f6b66;--ligne:#e1e6e3;--fond:#dfe6e2}
@media (prefers-color-scheme:dark){:root{--carte:#1b2220;--txt:#e8eeeb;--doux:#9fb0a8;--ligne:#2a3330;--fond:#2a312e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--fond)}
header{position:fixed;top:0;left:0;right:0;z-index:5;background:var(--vert);color:#fff;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;display:flex;align-items:center;gap:8px}
header h1{font-size:16px;margin:0;flex:1}
header a,header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px;text-decoration:none}
#cmd{position:fixed;top:calc(44px + env(safe-area-inset-top));left:0;right:0;z-index:4;padding:6px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:rgba(255,255,255,.9);box-shadow:0 1px 6px rgba(0,0,0,.15)}
@media (min-width:700px){#cmd{grid-template-columns:repeat(8,1fr)}}
@media (prefers-color-scheme:dark){#cmd{background:rgba(27,34,32,.92)}}
#cmd button{border:1px solid var(--ligne);border-radius:9px;padding:6px 2px;font-size:12.5px;background:var(--carte);color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmd button.on{background:var(--vert2);color:#fff;border-color:var(--vert2)}
#cmd button.mode.on{background:#0d47a1;border-color:#0d47a1}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#leg{position:fixed;left:8px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;background:rgba(255,255,255,.92);color:#1d2622;border-radius:10px;padding:6px 10px;font-size:12px;max-width:calc(100% - 16px)}
#leg.min>div,#leg.min>span{display:none}#leg.min::after{content:'Légende ▸'}
#leg .g{height:9px;border-radius:5px;margin:3px 0}
#fiche{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:6;background:var(--carte);border-radius:14px;padding:12px 14px;box-shadow:0 4px 20px rgba(0,0,0,.35);max-height:58vh;overflow:auto;display:none}
@media (min-width:700px){#fiche{left:auto;width:420px}}
#fiche h3{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:flex-start}
#fiche h3 span{flex:1}
#fiche .x{border:0;background:var(--ligne);border-radius:8px;padding:2px 9px;font-size:16px;color:var(--txt)}
.l{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--ligne);font-size:13.5px}
.sub{color:var(--doux);font-size:12.5px}
.verdict{margin:8px 0;padding:8px 10px;border-radius:10px;font-size:13.5px}
.v-op{background:#fff3e0;color:#7a3e00}.v-ok{background:#e8f5e9;color:#1b5e20}.v-fr{background:#e3f2fd;color:#0d47a1}
@media (prefers-color-scheme:dark){.v-op{background:#3d2a12;color:#ffcc80}.v-ok{background:#16301a;color:#a5d6a7}.v-fr{background:#132a3d;color:#90caf9}}
label{display:block;font-size:12px;color:var(--doux);margin-top:8px}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:7px 8px;border:1px solid var(--ligne);border-radius:8px;background:var(--carte);color:var(--txt)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.btn{border:0;border-radius:9px;padding:9px 6px;font-size:14px;background:var(--vert2);color:#fff}
.btn.s{background:var(--ligne);color:var(--txt)}.btn.r{background:#c62828}
#joy{position:fixed;left:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.8);z-index:4;display:none;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(27,94,32,.85)}
#msg{position:fixed;top:calc(130px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:7;background:rgba(0,0,0,.8);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;display:none;max-width:90%;text-align:center}
#charge{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:var(--fond);font-size:15px;color:var(--doux);flex-direction:column;gap:8px}
#charge b{display:block;width:180px;height:6px;border-radius:3px;background:var(--ligne);overflow:hidden}#charge b i{display:block;height:100%;width:0;background:var(--vert2)}
</style>
</head>
<body>
<header><a href="index.html">← Pilotage</a><h1>Surface de vente 3D</h1><button id="aide">?</button></header>
<div id="cmd"></div>
<canvas id="cv"></canvas>
<div id="joy"><i></i></div>
<div id="leg" onclick="this.classList.toggle('min')"></div>
<div id="fiche"></div>
<div id="msg"></div>
<div id="charge"><span>Chargement de la maquette…</span><b><i id="pc"></i></b></div>
<script type="module">
'use strict';
import * as T from './moteur3d.js';
const {GLTFLoader,OrbitControls,MeshoptDecoder}=T;
const $=s=>document.querySelector(s);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const eur=v=>num(v)===null?'—':Math.round(+v).toLocaleString('fr-FR')+' €';
const URL_DEF='https://script.google.com/macros/s/AKfycbyQvb6qxIQ9Z1Ah97F7UouUwmqRiXNDCr1YLzgZ7afWpVDUKwWy8KVb32nVSwM-Z0oiyg/exec';
const cfg=()=>({url:ls.get('pil_url')||URL_DEF,code:ls.get('pil_code')||''});
function msg(t,ms){const m=$('#msg');m.textContent=t;m.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>m.style.display='none',ms||2400)}

/* ---------- Données ---------- */
let D=null;try{D=JSON.parse(ls.get('pil_cache')||'null')}catch(e){}
let ETAT={};try{ETAT=JSON.parse(ls.get('pil_etat')||'{}')}catch(e){}
async function etatGet(){const c=cfg();if(!c.code)return;try{const r=await fetch(c.url,{method:'POST',body:JSON.stringify({code:c.code,action:'etat_get'})});const j=await r.json();if(j.ok){ETAT=j.etat||{};ls.set('pil_etat',JSON.stringify(ETAT));majObjets();majNotes()}}catch(e){}}
async function etatSet(k,v){ETAT[k]=v;ls.set('pil_etat',JSON.stringify(ETAT));const c=cfg();if(!c.code){msg('Enregistré sur cet appareil seulement (code non configuré)');return false}
  try{const r=await fetch(c.url,{method:'POST',body:JSON.stringify({code:c.code,action:'etat_set',cle:k,valeur:v})});const j=await r.json();return !!j.ok}catch(e){return false}}
const plan2=()=>{try{return JSON.parse(ETAT.plan2||'{}')}catch(e){return {}}};
const objEtat=()=>{try{return JSON.parse(ETAT.plan3d_obj||'{}')}catch(e){return {}}};

let PLAN=null,ZON=null,GR=null; // GR : grille 4 px/m (passage, marchable)
const BB=[9,-39,70,2],RES=4,GW=(BB[2]-BB[0])*RES,GH=(BB[3]-BB[1])*RES;
const cellOf=(x,z)=>[Math.floor((x-BB[0])*RES),Math.floor((z-BB[1])*RES)];
function marchable(x,z){if(!GR)return true;const [i,j]=cellOf(x,z);if(i<0||j<0||i>=GW||j>=GH)return false;return GR.walk[j*GW+i]>0}
function passage(x,z){if(!GR)return null;const [i,j]=cellOf(x,z);let b=0;for(let dj=-2;dj<=2;dj++)for(let di=-2;di<=2;di++){const ii=i+di,jj=j+dj;if(ii>=0&&jj>=0&&ii<GW&&jj<GH)b=Math.max(b,GR.pass[jj*GW+ii])}return b/255}

/* Marge par laboratoire (même rapprochement que le plan 2D) */
const MOTS_VIDES=new Set('BEBE HYGIENE INTIME SOINS SOIN DIVERS PROMOTION SAISONNIER SAISONNIERS LIBRE ACCES BIO LAIT HOMME FEMME CORPORELLE LAVANT SAVON SAVONS BACS SOLDEURS FORMAT VOYAGE LEVRES MAINS NATUREL DENTAIRE ACCESSOIRES GROS VOLUME MATERNITE SERUM TEST PREMIERS DENTS NUTRI DERMATO DERMATOLOGIE MAQUILLAGE SOLAIRE CHANGE COUCHES LINGETTES STRESS SOMMEIL SPORT PATCHS TONUS DIGESTION AMPOULE MINCEUR DIETETIQUE PANSEMENT PILULIER ORTHOPEDIE CONTENTION CHAUSSURES INCONTINENCE RENUTRITION VETERINAIRE PODOLOGIE DENTIFRICES DEODORANTS CEREALES TISANES VRAC ARTICULATION CIRCU MAGNESIUM PHYTO AROMA HERBORISTERIE ANTIGASPI SKIN GROSSESSES ALLAITEMENT PRESERVATIFS SERVIETTE'.split(' '));
const ALIAS={MUSTELA:'EXPANSCIENCE',DERCOS:'VICHY',ARKOGELULES:'ARKOPHARMA',AVENT:'PHILIPS AVENT',SCHOLL:'SCHOLL',GIBAUD:'GIBAUD'};
const norm=s=>String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/LA R POSAY/,'LA ROCHE POSAY').replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();
let LABS=null;
function margeLab(nom){if(!D||!D.labos)return null;if(!LABS)LABS=D.labos.map(z=>({n:norm(z['Laboratoire']),m:num(z['Marge € 12 mois'])||0}));
  const L=norm(nom);if(L.length<3)return null;const vus=new Map();const pr=x=>{if(x&&!vus.has(x.n))vus.set(x.n,x.m)};
  pr(LABS.find(z=>z.n.startsWith(L)));
  if(!vus.size)L.split(' ').filter(w=>w.length>=4&&!MOTS_VIDES.has(w)).forEach(w=>{const a=ALIAS[w];if(a){pr(LABS.find(z=>z.n.startsWith(a)));return}pr(LABS.find(z=>z.n.startsWith(w+' ')||z.n===w)||LABS.find(z=>(' '+z.n+' ').includes(' '+w+' ')))});
  return vus.size?[...vus.values()].reduce((s,v)=>s+v,0):null}

/* ---------- Scène ---------- */
const cv=$('#cv');let R;
try{R=new T.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'})}catch(e){$('#charge').innerHTML='Votre appareil ne peut pas afficher la 3D (WebGL indisponible). Le plan 2D reste disponible dans Pilotage.';throw e}
R.setPixelRatio(Math.min(devicePixelRatio||1,1.75));R.outputColorSpace=T.SRGBColorSpace;
const S=new T.Scene();S.background=new T.Color(0xdfe6e2);
const cam=new T.PerspectiveCamera(55,1,0.1,400);
S.add(new T.HemisphereLight(0xffffff,0x8a8f8c,2.4));const sol=new T.DirectionalLight(0xffffff,1.1);sol.position.set(20,40,10);S.add(sol);
const ctl=new OrbitControls(cam,cv);ctl.enableDamping=true;ctl.dampingFactor=.12;
let sale=true;const salir=()=>{sale=true};ctl.addEventListener('change',salir);
function taille(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();salir()}addEventListener('resize',taille);taille();
const C={x:(BB[0]+56)/2,z:-22}; // centre de la zone de vente

const groupes={};const G=n=>{if(!groupes[n]){groupes[n]=new T.Group();groupes[n].name=n;S.add(groupes[n])}return groupes[n]};
let MAQ=null;const cibles=[]; // objets « cliquables »

/* Étiquettes (sprites) */
function etiquette(txt,{taille=.45,fond='rgba(255,255,255,.92)',coul='#1d2622',gras=true}={}){
  const c=document.createElement('canvas'),x=c.getContext('2d'),f=(gras?'700 ':'500 ')+'44px -apple-system,Segoe UI,Roboto,sans-serif';x.font=f;const w=Math.ceil(x.measureText(txt).width)+28;c.width=w;c.height=64;
  x.font=f;x.fillStyle=fond;const r=14;x.beginPath();x.roundRect?x.roundRect(0,0,w,64,r):x.rect(0,0,w,64);x.fill();x.fillStyle=coul;x.textBaseline='middle';x.fillText(txt,14,34);
  const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;t.minFilter=T.LinearFilter;
  const s=new T.Sprite(new T.SpriteMaterial({map:t,depthTest:false,transparent:true}));s.scale.set(taille*w/64,taille,1);s.renderOrder=10;return s}

/* ---------- Couches ---------- */
const COUCHES=[['univers','🎨 Univers'],['passage','🚶 Passage'],['marge','🔥 Marge'],['reperes','📍 Repères'],['labos','🏷️ Labos'],['bf','🖤 Black Friday'],['objets','🧩 Objets'],['notes','📝 Notes']];
let actives=(()=>{try{return JSON.parse(ls.get('p3d_couches')||'null')||['univers','reperes']}catch(e){return ['univers','reperes']}})();
let mode='dessus';
function barre(){
  const m=[['dessus','⬆ Dessus'],['survol','🌀 Survol'],['visite','🚶‍♂️ Visite']];
  $('#cmd').innerHTML=m.map(([k,t])=>`<button class="mode ${mode===k?'on':''}" data-m="${k}">${t}</button>`).join('')+`<button data-a="ajout">＋ Objet</button>`+
    COUCHES.map(([k,t])=>`<button class="${actives.includes(k)?'on':''}" data-c="${k}">${t}</button>`).join('');
  $('#cmd').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    if(b.dataset.m){changerMode(b.dataset.m);return}
    if(b.dataset.a==='ajout'){ficheAjout();return}
    const k=b.dataset.c;if(actives.includes(k))actives=actives.filter(x=>x!==k);else{actives.push(k);if(k==='passage')actives=actives.filter(x=>x!=='marge');if(k==='marge')actives=actives.filter(x=>x!=='passage')}
    ls.set('p3d_couches',JSON.stringify(actives));appliquerCouches();barre()});
  placerVue()}
function placerVue(){const h=$('#cmd').getBoundingClientRect().bottom;$('#msg').style.top=(h+8)+'px'}
function appliquerCouches(){
  for(const [k] of COUCHES)if(groupes[k])groupes[k].visible=actives.includes(k);
  if(groupes.sol)groupes.sol.visible=actives.includes('passage')||actives.includes('marge');
  if(SOLTEX&&actives.includes('passage'))peindreSol('passage');else if(SOLTEX&&actives.includes('marge'))peindreSol('marge');
  const L=[];
  if(actives.includes('passage'))L.push(`<b>Passage estimé</b><div class="g" style="background:linear-gradient(90deg,#2b0b3a,#a3256b,#f37a2c,#fdeca0)"></div><span class="sub">Chemins les plus courts des entrées A et B vers les comptoirs (modèle, pas un comptage)</span>`);
  if(actives.includes('marge'))L.push(`<b>Marge 12 mois des labos présents</b><div class="g" style="background:linear-gradient(90deg,#2166ac,#67a9cf,#fee08b,#f46d43,#b2182b)"></div><span class="sub">❄️ peu de marge · 🔥 beaucoup ${D&&D.labos?'':'— données Vindilis non chargées : ouvrez Pilotage une fois'}</span>`);
  if(actives.includes('univers')&&ZON)L.push(Object.entries(ZON.couleurs).map(([c,n])=>`<span style="display:inline-block;margin-right:8px"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#${c};margin-right:3px"></i>${esc(n)}</span>`).join(''));
  $('#leg').innerHTML=L.map(x=>'<div>'+x+'</div>').join('<div style="height:6px"></div>');$('#leg').style.display=L.length&&mode!=='visite'&&$('#fiche').style.display!=='block'?'block':'none';salir()}

/* Univers : bandes colorées le long des linéaires du zoning */
function construireUnivers(){const g=G('univers');
  ZON.U.forEach(([c,p])=>{const sh=new T.Shape(p.map(([x,y])=>new T.Vector2(x,-y)));const geo=new T.ExtrudeGeometry(sh,{depth:1.75,bevelEnabled:false});geo.rotateX(-Math.PI/2);
    const m=new T.Mesh(geo,new T.MeshBasicMaterial({color:'#'+c,transparent:true,opacity:.42,depthWrite:false}));m.position.y=.04;m.userData={type:'univers',nom:ZON.couleurs[c]||''};g.add(m)});
  ZON.UL.forEach(([n,[x,y]])=>{const s=etiquette(n.replace('Beaute','Beauté').replace('Bebe','Bébé').replace('Hygiene','Hygiène').replace('Libre Acces','Libre accès').replace('Veterinaire','Vétérinaire'),{taille:.55});s.position.set(x,2.5,y);g.add(s)})}
/* Repères : TG, bacs, barres de charge, écrans */
const REP=[];
function construireReperes(){const g=G('reperes');
  const ajout=(k,t,x,z,coul,h=2.05)=>{const s=etiquette(t,{taille:.38,fond:coul,coul:'#fff'});s.position.set(x,h,z);s.userData={type:'repere',k};g.add(s);REP.push({k,x,z,s})};
  ZON.TG.forEach(([n,[x,y]])=>ajout(n.replace(/\s+/g,' ').trim(),n.replace(/\s+/g,' ').trim(),x,y,'#6a1b9a'));
  ZON.BACS.forEach(([n,s,[x,y]])=>ajout(n,'Bacs '+n.replace('Bacs soldeurs ',''),x,y,'#ef6c00',1.3));
  ZON.BDC.forEach(([n,s,[x,y]])=>ajout(n,'BDC '+n.replace('Barres de charge ',''),x,y,'#5d4037',1.9));
  ZON.ECR.forEach(([x,y],i)=>ajout('Écran zoning '+(i+1),'▣ Écran '+(i+1),x,y,'#0d47a1',2.3));
  [['Entrée A',13.1,-35.6],['Entrée B',18.5,-12.2],['Comptoirs',54.6,-20.1]].forEach(([n,x,z])=>ajout(n,n,x,z,'#1b5e20',2.7))}
function construireLabos(){const g=G('labos');ZON.L.forEach(([n,[x,y]],i)=>{const s=etiquette(n,{taille:.26,gras:false});s.position.set(x,1.85,y);s.userData={type:'labo',n};g.add(s)})}

/* Sol coloré (passage / marge) */
let SOLTEX=null,SOLCV=null,MARGECV=null;
function construireSol(){SOLCV=document.createElement('canvas');SOLCV.width=GW;SOLCV.height=GH;SOLTEX=new T.CanvasTexture(SOLCV);SOLTEX.colorSpace=T.SRGBColorSpace;SOLTEX.magFilter=T.LinearFilter;
  const geo=new T.PlaneGeometry(BB[2]-BB[0],BB[3]-BB[1]);geo.rotateX(-Math.PI/2);
  const m=new T.Mesh(geo,new T.MeshBasicMaterial({map:SOLTEX,transparent:true,depthWrite:false,opacity:.85}));m.position.set((BB[0]+BB[2])/2,.05,(BB[1]+BB[3])/2);m.renderOrder=2;G('sol').add(m)}
const ramp=(S,t)=>{for(let i=1;i<S.length;i++)if(t<=S[i][0]){const u=(t-S[i-1][0])/(S[i][0]-S[i-1][0]),a=S[i-1][1],b=S[i][1];return a.map((v,k)=>Math.round(v+(b[k]-v)*u))}return S[S.length-1][1]};
const R_PASS=[[0,[43,11,58]],[.35,[163,37,107]],[.7,[243,122,44]],[1,[253,236,160]]];
const R_MARGE=[[0,[33,102,172]],[.35,[103,169,207]],[.55,[254,224,139]],[.75,[244,109,67]],[1,[178,24,43]]];
let MARGEF=null;
function calculMarge(){if(MARGEF!==null)return MARGEF;MARGEF=false;if(!D||!D.labos)return MARGEF;const cnt={};ZON.L.forEach(x=>{const k=x[0].toUpperCase();cnt[k]=(cnt[k]||0)+1});
  const pts=ZON.L.map(x=>{const m=margeLab(x[0]);return {n:x[0],x:x[1][0],y:x[1][1],w:m===null?null:m/cnt[x[0].toUpperCase()]}}).filter(p=>p.w!==null);
  const f=new Float32Array(GW*GH),g=new Float32Array(GW*GH),s2=2*2.2*2.2;
  for(let j=0;j<GH;j++)for(let i=0;i<GW;i++){const X=BB[0]+(i+.5)/RES,Y=BB[1]+(j+.5)/RES;let a=0,b=0;for(const p of pts){const dx=X-p.x,dy=Y-p.y,d=dx*dx+dy*dy;if(d>36)continue;const k=Math.exp(-d/s2);a+=k*p.w;b+=k}f[j*GW+i]=a;g[j*GW+i]=b}
  const v=pts.map(p=>{const [i,j]=cellOf(p.x,p.y);return f[Math.max(0,Math.min(GH-1,j))*GW+Math.max(0,Math.min(GW-1,i))]}).sort((a,b)=>a-b);
  MARGEF={f,g,hi:v[Math.floor(v.length*.9)]||1,lo:v[Math.floor(v.length*.1)]||0};return MARGEF}
function margeEn(x,z){const M=calculMarge();if(!M)return null;const [i,j]=cellOf(x,z);if(i<0||j<0||i>=GW||j>=GH)return null;const q=j*GW+i;if(M.g[q]<.05)return null;return Math.max(0,Math.min(1,(M.f[q]-M.lo)/((M.hi-M.lo)||1)))}
function peindreSol(k){const x=SOLCV.getContext('2d'),im=x.createImageData(GW,GH);
  if(k==='passage'&&GR){for(let q=0;q<GW*GH;q++){if(!GR.walk[q]){im.data[q*4+3]=0;continue}const c=ramp(R_PASS,GR.pass[q]/255);im.data[q*4]=c[0];im.data[q*4+1]=c[1];im.data[q*4+2]=c[2];im.data[q*4+3]=200}}

/* ---------- Chargement ---------- */
async function lireGrille(){const img=new Image();img.src='grille.png?v=1';await img.decode();const c=document.createElement('canvas');c.width=GW;c.height=GH;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const d=x.getImageData(0,0,GW,GH).data;
  const pass=new Uint8Array(GW*GH),walk=new Uint8Array(GW*GH);for(let q=0;q<GW*GH;q++){pass[q]=d[q*4];walk[q]=d[q*4+1]>127?1:0}GR={pass,walk}}
async function demarrer(){
  const [p,z]=await Promise.all([fetch('plan.json').then(r=>r.json()),fetch('zoning.json').then(r=>r.json()),lireGrille().catch(()=>{})]);PLAN=p;ZON=z;
  const ld=new GLTFLoader();ld.setMeshoptDecoder(MeshoptDecoder);
  const g=await new Promise((ok,ko)=>ld.load('pharmacie3d.glb?v=2',ok,e=>{if(e.total)$('#pc').style.width=Math.round(e.loaded/e.total*100)+'%'},ko));
  MAQ=g.scene;MAQ.traverse(m=>{if(m.isMesh){m.material.side=T.FrontSide;if(m.material.metalness!==undefined){m.material.metalness=0;m.material.roughness=1}}});S.add(MAQ);
  construireUnivers();construireReperes();construireLabos();construireSol();majObjets();majNotes();
  $('#charge').style.display='none';barre();changerMode('dessus');appliquerCouches();etatGet()}
let t0=performance.now();
function boucle(t){const dt=Math.min(.05,(t-t0)/1000);t0=t;if(mode==='visite')avancer(dt);else ctl.update();if(sale){R.render(S,cam);sale=false}requestAnimationFrame(boucle)}
requestAnimationFrame(boucle);window.__d={cam,ctl};
demarrer().catch(e=>{$('#charge').innerHTML='Impossible de charger la maquette : '+esc(e.message||e)});
</script>
