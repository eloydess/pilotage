<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pilotage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Pilotage Pharmacie</title>
<style>
:root{--vert:#1b5e20;--vert2:#2e7d32;--fond:#f4f6f5;--carte:#fff;--txt:#1d2622;--doux:#5f6b66;--ligne:#e1e6e3;--rouge:#c62828;--orange:#e65100;--bleu:#0d47a1;--violet:#4a148c}
@media (prefers-color-scheme:dark){:root{--fond:#111614;--carte:#1b2220;--txt:#e8eeeb;--doux:#9fb0a8;--ligne:#2a3330;--vert2:#66bb6a;--rouge:#ef5350;--orange:#ffa040}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--txt);padding-bottom:calc(124px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--vert);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
main{padding:12px 16px;max-width:760px;margin:auto}
.fige{position:sticky;top:var(--hh,52px);z-index:4;background:var(--fond);margin:0 -16px;padding:8px 16px 2px;box-shadow:0 6px 8px -8px rgba(0,0,0,.35)}.fige>.carte{margin-top:0}.fige .titre{margin:6px 0 4px}
.leg{font-size:12px;color:var(--doux);white-space:normal;line-height:1.6}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--carte);border-top:1px solid var(--ligne);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{border:0;background:none;color:var(--doux);padding:6px 2px 5px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:52px}
nav button span{font-size:19px}
nav button.on{color:var(--vert2);font-weight:600}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.titre{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--doux);margin:16px 2px 8px;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .l{font-size:12px;color:var(--doux)}.kpi .v{font-size:20px;font-weight:700;margin:2px 0}.kpi .e{font-size:13px;font-weight:600}
.pos{color:var(--vert2)}.neg{color:var(--rouge)}
.ligne{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--ligne)}.ligne:last-child{border:0}
.ligne b{text-align:right}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--ligne);color:var(--txt)}
.p1{background:#ffcdd2;color:#b71c1c}.p2{background:#ffe0b2;color:#8a3b00}.p3{background:#e3f2fd;color:#0d47a1}
.A{background:#c8e6c9;color:#1b5e20}.B{background:#fff59d;color:#5d4b00}.C{background:#eceff1;color:#455a64}
.Actif{background:#c8e6c9;color:#1b5e20}.Vide{background:#ffe0b2;color:#8a3b00}.Échu{background:#ffcdd2;color:#b71c1c}
.reco .cible{font-weight:700}.reco .act{margin:6px 0}.reco .meta{font-size:12px;color:var(--doux)}
.statuts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.statuts button{border:1px solid var(--ligne);background:none;color:var(--txt);border-radius:16px;padding:5px 10px;font-size:13px}
.statuts button.on{background:var(--vert2);border-color:var(--vert2);color:#fff}
.item{display:flex;align-items:center;gap:10px;cursor:pointer}.item .grow{flex:1;min-width:0}.item .sub{font-size:12px;color:var(--doux);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--ligne);border-radius:8px;background:var(--fond);color:var(--txt)}
label{display:block;font-size:12px;color:var(--doux);margin:10px 0 4px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:600;background:var(--vert2);color:#fff;margin-top:14px}
.btn.sec{background:var(--ligne);color:var(--txt)}
.filtres{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px}
.filtres button{flex:none;border:1px solid var(--ligne);background:var(--carte);color:var(--txt);border-radius:16px;padding:5px 12px;font-size:13px}
.filtres button.on{background:var(--vert2);color:#fff;border-color:var(--vert2)}
.diag{border-left:4px solid var(--orange);font-weight:600}
.score{font-weight:800;font-size:15px}
#toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:#263238;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9;max-width:90%}
#toast.on{opacity:1}
.vide{color:var(--doux);text-align:center;padding:24px 0}
.ico{font-size:20px;width:26px;text-align:center;flex:none}
.barre{height:10px;border-radius:5px;background:var(--ligne);overflow:hidden;margin:8px 0 4px}.barre i{display:block;height:100%;background:var(--vert2)}
.tuiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}.tuile{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer}.tuile b{display:block;font-size:22px}.tuile span{font-size:11px;color:var(--doux)}
.alerte{border-left:4px solid var(--rouge)}
.ordre{white-space:pre-line;font-size:13px;margin-top:8px;padding:8px 10px;background:var(--fond);border-radius:8px}
.fab{position:fixed;right:18px;bottom:calc(132px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--vert2);color:#fff;font-size:28px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
/* --- Version ordinateur (même adresse, mêmes données) --- */
@media (min-width:1024px){
body{padding:0 0 30px 230px}
header{padding:14px 28px}header h1{font-size:20px}.fige{margin:0 -28px;padding:10px 28px 2px}
nav{top:0;bottom:0;right:auto;width:230px;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--ligne);padding:70px 10px 10px;gap:2px}
nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;min-height:44px;padding:8px 14px;border-radius:10px}
nav button span{font-size:20px;width:26px;text-align:center}
nav button.on{background:var(--fond)}
nav::before{content:"Pilotage pharmacie";position:absolute;top:22px;left:24px;font-weight:800;color:var(--vert2);font-size:16px}
main{max-width:1500px;padding:20px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:0 16px;align-items:start}
main>*{grid-column:1/-1}
main>.item,main>.reco,main>.op{grid-column:auto}
.kpis{grid-template-columns:repeat(4,1fr)}
.tuiles{grid-template-columns:repeat(3,1fr)}
.item .sub{white-space:normal}
.fab{bottom:28px;right:28px}
#toast{bottom:40px}
}
</style>
</head>
<body>
<header><h1 id="ht">Pilotage</h1><button id="bCfg" aria-label="Réglages" onclick="reglages()">⚙</button><button id="bRef" aria-label="Actualiser">↻</button></header>
<main id="m"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
'use strict';
const APP_V='1.13';
const ONGLETS=[['acc','🎯','Accueil'],['act','✅','Actions'],['lab','🧪','Labos'],['cmd','📦','Commandes'],['agd','📅','Agenda'],['ray','🛒','Rayon'],['ecr','📺','Écrans'],['mois','📈','Mois'],['3d','🧊','3D'],['cfg','⚙️','Réglages']];
let D=null,vue='acc',filtre='Classement',recherche='',filtreLab='Tous',voirPasses=false,filtreOps=0;
const $=s=>document.querySelector(s);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>(v===''||v===null||v===undefined||isNaN(+v))?null:+v;
const eur=v=>num(v)===null?'—':Math.round(+v).toLocaleString('fr-FR')+' €';
const eur2=v=>num(v)===null?'—':(+v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const ent=v=>num(v)===null?'—':Math.round(+v).toLocaleString('fr-FR');
const pct=(v,s)=>num(v)===null?'—':((s&&v>0?'+':'')+(v*100).toLocaleString('fr-FR',{maximumFractionDigits:1})+' %');
const dfr=v=>{if(!v)return '—';const p=String(v).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v};
const isoMois=v=>{if(v===null||v===undefined||v==='')return '';const n=Number(v);if(isFinite(n)&&n>20000){const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5);return d.toISOString().slice(0,10)}return String(v)};
const moisFr=v=>{const s=isoMois(v);if(!/^\d{4}-\d{2}/.test(s))return s||'—';const p=s.split('-');const d=new Date(+p[0],+p[1]-1,15);return d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})};
const cls=v=>num(v)===null?'':(v<0?'neg':'pos');

const COUL={'Urgent':['#ffcdd2','#b71c1c'],'Cette semaine':['#ffe0b2','#8a3b00'],'À surveiller':['#e3f2fd','#0d47a1'],'En cours':['#ffcdd2','#b71c1c'],'À préparer':['#ffe0b2','#8a3b00'],'À venir':['#e3f2fd','#0d47a1'],'Passé':['#eceff1','#78909c']};
const bdg=t=>{const c=COUL[t];return `<span class="badge" ${c?`style="background:${c[0]};color:${c[1]}"`:''}>${esc(t)}</span>`};
const auj=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const jours=v=>{if(!v||!/^\d{4}-\d{2}-\d{2}/.test(v))return null;const a=new Date(String(v).slice(0,10)+'T12:00:00'),b=new Date(auj()+'T12:00:00');return Math.round((b-a)/864e5)};
/* Statut prix d'un laboratoire : icône + libellé + groupe de filtre */
function etatPrix(x){const pol=x['Politique prix']||'',st=x['Statut prix']||'';
  if(pol==='Imposé')return ['🔒','Prix imposé','Imposé'];
  if(st==='Fait')return ['✅','Prix à jour','Fait'];
  if(st==='À valider')return ['🟠','À valider','À valider'];
  if(st==='À revoir'||st==='À importer')return ['🟡',st,'À revoir'];
  if(st==='En cours')return ['🔵','En cours','À valider'];
  if(st==='À faire')return ['⭕','À faire','À faire'];
  if(pol==='Administré')return ['➖','Hors périmètre (remboursé)','Hors périmètre'];
  return ['❔','À préciser','À faire'];}
const P=k=>D&&D.params?num(D.params[k]):null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------- API ---------- */
const URL_DEF='https://script.google.com/macros/s/AKfycbyQvb6qxIQ9Z1Ah97F7UouUwmqRiXNDCr1YLzgZ7afWpVDUKwWy8KVb32nVSwM-Z0oiyg/exec';
const cfg=()=>({url:ls.get('pil_url')||URL_DEF,code:ls.get('pil_code')||''});
let enCours=false,derniereErreur='';
async function charger(silencieux){
  const c=cfg(); if(!c.url||!c.code){derniereErreur='Saisissez votre code d\'accès.';reglages();return}
  if(!silencieux)toast('Actualisation…');
  enCours=true; if(!D)$('#m').innerHTML='<p class="vide">Chargement…</p>';
  try{
    const r=await fetch(c.url+'?code='+encodeURIComponent(c.code)+'&t='+Date.now());
    const j=await r.json();
    enCours=false;
    if(!j.ok){derniereErreur=j.err||'Erreur';toast(derniereErreur);if(/Code/.test(j.err||'')||!D)reglages();return}
    derniereErreur=''; D=j; ls.set('pil_cache',JSON.stringify(j)); if(vue==='cfg')vue='acc'; rendre(); if(!silencieux)toast('À jour');
  }catch(e){enCours=false;derniereErreur='Connexion impossible au serveur ('+(e&&e.message||e)+').';if(D)toast('Hors ligne : dernières données affichées');else{toast('Connexion impossible');reglages();}}
}
async function poster(body){
  const c=cfg();
  try{
    const r=await fetch(c.url,{method:'POST',body:JSON.stringify(Object.assign({code:c.code},body))});
    const j=await r.json(); if(!j.ok){toast(j.err||'Erreur');return false} return true;
  }catch(e){toast('Échec de l\'envoi (réseau)');return false}
}

/* ---------- Réglages ---------- */
function reglages(){
  const c=cfg(); $('#ht').textContent='Réglages';
  $('#m').innerHTML=`${derniereErreur?`<div class="carte" style="border-left:4px solid #c62828"><b>⚠ ${esc(derniereErreur)}</b></div>`:''}<div class="carte"><p>Saisissez votre code d'accès puis touchez « Enregistrer ». L'adresse est déjà remplie : n'y touchez pas.</p>
  <label>Adresse de l'application Web</label><input id="u" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/…/exec">
  <label>Code d'accès</label><input id="c" type="password" inputmode="numeric" value="${esc(c.code)}">
  <button class="btn" id="ok">Enregistrer</button><p style="font-size:12px;color:var(--doux);margin-top:10px">Application v${APP_V}${D&&D.version?' · serveur v'+esc(D.version):''}</p></div>`+(D&&D.fraicheur&&D.fraicheur.length?`<div class="titre">Mises à jour des données</div><div class="carte">${D.fraicheur.map(f=>`<div class="ligne"><span>${f.enRetard?'⚠':'✅'} ${esc(f.source)}<br><small style="color:var(--doux)">${esc(f.frequence)}${f.echec?' · dernier échec '+esc(f.echec):''}</small></span><b class="${f.enRetard?'neg':''}">${esc(f.dernier)}</b></div>`).join('')}</div>`:'');
  $('#ok').onclick=()=>{ls.set('pil_url',$('#u').value.trim()||URL_DEF);$('#ok').textContent='Connexion…';ls.set('pil_code',$('#c').value.trim());if(vue==='cfg')vue='acc';charger()};
}

/* ---------- Rendu ---------- */
function navig(){
  $('#nav').innerHTML=ONGLETS.map(o=>`<button data-v="${o[0]}" class="${o[0]===vue?'on':''}"><span>${o[1]}</span>${o[2]}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.dataset.v; if(v==='3d'){location.href='3d.html';return} if(v==='cfg'){vue='cfg';navig();reglages();return} vue=v;recherche='';rendre();scrollTo(0,0)});
}
function rendre(){navig(); if(!D){if(enCours){$('#m').innerHTML='<p class="vide">Chargement…</p>';return} reglages();return}
  ({acc:accueil,act:actions,lab:labos,cmd:commandes,agd:agenda,ray:rayon,ecr:ecrans,mois:mois,cfg:reglages})[vue]();}

const ouverte=r=>r['Statut']!=='Fait'&&r['Statut']!=='Ignoré';
function carteReco(r,i){
  const st=['Nouveau','En cours','Fait','Ignoré'];
  return `<div class="carte reco"><div><span class="badge p${r['Priorité']}">P${r['Priorité']}</span> <span class="badge">${esc(r['Domaine'])}</span></div>
  <div class="cible" style="margin-top:6px">${esc(r['Cible'])}</div><div class="meta">${esc(r['Constat'])}</div>
  <div class="act">→ ${esc(r['Action recommandée'])}</div>
  <div class="meta">${num(r['Impact € estimé /an'])!==null?'Impact estimé : <b>'+eur(r['Impact € estimé /an'])+'/an</b> · ':''}${r['Responsable']?'Responsable : '+esc(r['Responsable'])+' · ':''}détectée le ${dfr(r['Détectée le'])}</div>
  <div class="statuts">${st.map(s=>`<button data-id="${esc(r['ID'])}" data-s="${s}" class="${r['Statut']===s?'on':''}">${s}</button>`).join('')}</div></div>`;
}
function brancherStatuts(){
  document.querySelectorAll('.statuts button').forEach(b=>b.onclick=async()=>{
    const r=D.recos.find(x=>x['ID']===b.dataset.id); if(!r)return;
    const ancien=r['Statut']; r['Statut']=b.dataset.s; rendre();
    if(!(await poster({action:'reco',id:r['ID'],statut:b.dataset.s}))){r['Statut']=ancien;rendre()} else toast('Statut : '+b.dataset.s);
  });
}

let moisSel='';
function moisDispo(){return (D.perf||[]).filter(p=>num(p['Marge € N'])!==null||num(p['CA HT N'])!==null).map(p=>isoMois(p['Mois'])).filter(Boolean).sort()}
function kpi2(l,n,n1,fmt){const e=(num(n)!==null&&num(n1)!==null&&+n1!==0)?(n/n1-1):null;
  return `<div class="carte kpi"><div class="l">${l}</div><div class="v">${fmt(n)}</div><div class="e ${cls(e)}">${e===null?'—':pct(e,1)} <span style="color:var(--doux);font-weight:400">vs ${fmt(n1)}</span></div></div>`}
function grapheCA(ms,sel){const P=(D.perf||[]).map(p=>({m:isoMois(p['Mois']),n:num(p['CA HT N']),n1:num(p['CA HT N-1'])})).filter(p=>p.m&&(p.n!==null||p.n1!==null)).sort((a,b)=>a.m<b.m?-1:1).slice(-12);
  if(P.length<2)return '';const W=340,H=170,g=40,d=8,hb=22,ht=10;const all=P.flatMap(p=>[p.n,p.n1]).filter(v=>v!==null);
  const mx=Math.max(...all)*1.08,mn=Math.min(...all)*0.85;const X=i=>g+i*(W-g-d)/(P.length-1),Y=v=>ht+(H-ht-hb)*(1-(v-mn)/(mx-mn));
  const line=(k,c,dash)=>`<polyline points="${P.map((p,i)=>p[k]===null?'':X(i).toFixed(1)+','+Y(p[k]).toFixed(1)).filter(Boolean).join(' ')}" fill="none" stroke="${c}" stroke-width="2" ${dash?'stroke-dasharray="4 4"':''}/>`;
  const ticks=[0,0.5,1].map(t=>mn+(mx-mn)*t);const k=v=>Math.round(v/1000)+' k';
  const si=P.findIndex(p=>p.m===sel);
  return `<div class="carte"><b>Chiffre d'affaires HT — N vs N-1</b><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:6px" role="img" aria-label="CA HT N vs N-1">
   ${ticks.map(v=>`<line x1="${g}" x2="${W-d}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eceff1"/><text x="${g-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="#78909c">${k(v)}</text>`).join('')}
   ${si>=0?`<line x1="${X(si)}" x2="${X(si)}" y1="${ht}" y2="${H-hb}" stroke="#ffb300" stroke-width="6" opacity=".25"/>`:''}
   ${line('n1','#90a4ae',1)}${line('n','#1b5e20')}
   ${P.map((p,i)=>`<text x="${X(i)}" y="${H-6}" font-size="9" text-anchor="middle" fill="${i===si?'#1b5e20':'#78909c'}" ${i===si?'font-weight="700"':''}>${moisFr(p.m).slice(0,3)}</text>`).join('')}
  </svg><div class="sub" style="font-size:11px;color:var(--doux)"><span style="color:#1b5e20">━ N</span> · <span style="color:#90a4ae">┅ N-1</span> · mois sélectionné surligné</div></div>`}
const majHH=()=>{const h=document.querySelector('header');if(h)document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')};
addEventListener('resize',majHH);addEventListener('load',majHH);setTimeout(majHH,0);
const ST_LIB={Actif:'En place',Vide:'Libre',Échu:'À changer'};const stLib=v=>ST_LIB[v]||v;
let modeEx='cumul';
function carteExercice(){
  // Exercice comptable du 1er avril au 31 mars. Chaque mois : valeur N de sa propre ligne, sinon N-1 de la ligne un an plus tard.
  const V={};(D.perf||[]).forEach(p=>{const m=isoMois(p['Mois']);if(!m)return;const y=+m.slice(0,4),mo=m.slice(5,7);
    const set=(k,ca,mg)=>{V[k]=V[k]||{};if(num(ca)!==null&&V[k].ca==null)V[k].ca=+ca;if(num(mg)!==null&&V[k].mg==null)V[k].mg=+mg};
    set(m,p['CA HT N'],p['Marge € N']);set((y-1)+'-'+mo+'-01',p['CA HT N-1'],p['Marge € N-1'])});
  // la valeur N d'une ligne prime sur la valeur N-1 reprise d'une autre ligne
  (D.perf||[]).forEach(p=>{const m=isoMois(p['Mois']);if(m&&num(p['CA HT N'])!==null){V[m].ca=+p['CA HT N'];if(num(p['Marge € N'])!==null)V[m].mg=+p['Marge € N']}});
  const moisAvecN=(D.perf||[]).filter(p=>num(p['CA HT N'])!==null).map(p=>isoMois(p['Mois'])).filter(Boolean).sort();
  if(!moisAvecN.length)return '';

   ${x['Classe labo']?'<span class="badge '+esc(x['Classe labo'])+'">'+esc(x['Classe labo'])+'</span>':''}</div>`).join('')||'<p class="vide">Aucun élément.</p>');
  document.querySelectorAll('.item').forEach(e=>e.onclick=()=>formulaire(sheet,l[+e.dataset.i]));

const rayon=()=>liste('SURFACE_VENTE','Code emplacement','Surface de vente',x=>[x['Type'],x['Laboratoire'],x['Produit / thème'],x['Fin']?'fin '+dfr(x['Fin']):'',num(x['Marge €/semaine'])!==null?eur(x['Marge €/semaine'])+'/sem.':'',x['Relais écran']==='Non'?'⚠ sans écran':''].filter(Boolean).map(esc).join(' · '));
const REGLES=[['Un écran, un objectif','Faire entrer, monter le panier ou prendre rendez-vous. Jamais les trois.'],['Un seul message dehors','Une boucle de cinq messages ne se lit pas.'],['Quatre semaines de stock','Ne jamais diffuser un produit en rupture.'],['Même visuel dedans et dehors','Pendant toute la campagne.'],['Rotation tous les 15 jours','Sept jours en période d\'événement.'],['Une mesure par campagne','Ventes du produit sur 4 semaines contre les 4 précédentes.']];
function blocPhares(){const p=(D.produitsEcrans||[]).slice().sort((a,b)=>(num(a['Rang'])||99)-(num(b['Rang'])||99));if(!p.length)return '';
  return `<div class="titre">Produits phares à afficher (liste pour Dynamiz Pharma)</div><div class="carte"><div class="sub" style="font-size:12px;color:var(--doux);white-space:normal">Produits déjà forts chez nous ET parmi les plus vendus des grandes officines (GERS, 12 mois 09/2025 → 08/2026) : ils font venir les clients. Médicaments exclus (publicité encadrée). ⚠ = à réassortir avant diffusion.</div></div>
  ${p.map(x=>`<div class="carte"><span class="badge">n°${esc(x['Rang'])}</span> <b>${esc(x['Produit'])}</b>${num(x['Stock au relevé'])!==null&&num(x['Stock au relevé'])<=0?' <b class="neg">⚠ rupture</b>':''}<div class="sub" style="font-size:12px;color:var(--doux);white-space:normal">${esc(x['Laboratoire'])} · ${ent(x['Ventes 12 mois (u)'])} ventes/12 mois · ${eur(x['Marge 12 mois €'])} de marge · n°${esc(x['Rang GERS grandes officines'])} des grandes officines${x['Pourquoi']?' · '+esc(x['Pourquoi']):''}</div></div>`).join('')}`}

   <div class="carte"><b>Mesurer l'impact</b><div class="sub" style="font-size:12px;color:var(--doux);white-space:normal">Renseignez Début, Fin, Contenu et Laboratoire de chaque diffusion : l'effet se lit sur les ventes du produit 4 semaines pendant vs 4 semaines avant.</div></div>

function grapheMasse(){const S=(D.rhSerie||[]).filter(x=>num(x[1])!==null);if(S.length<2)return '';
  const W=340,H=170,g=38,d=8,hb=22,ht=10;const vals=S.map(x=>+x[1]),ref=num(S[S.length-1][2]);
  const mx=Math.max(...vals,ref||0)*1.05,mn=0;const X=i=>g+i*(W-g-d)/(S.length-1),Y=v=>ht+(H-ht-hb)*(1-(v-mn)/(mx-mn));
  const pts=S.map((x,i)=>X(i).toFixed(1)+','+Y(+x[1]).toFixed(1)).join(' ');
  const ticks=[0,0.25,0.5,0.75,1].map(t=>mx*t);
  const k=v=>Math.round(v/1000)+' k';
  const lab=S.map((x,i)=>{const m=isoMois(x[0]);return (m.slice(5,7)==='01'||i===S.length-1)?`<text x="${X(i)}" y="${H-6}" font-size="9" text-anchor="middle" fill="#78909c">${m.slice(5,7)==='01'?m.slice(0,4):moisFr(m).slice(0,4)+'.'}</text>`:''}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:6px" role="img" aria-label="Masse salariale chargée par mois">
   ${ticks.map(v=>`<line x1="${g}" x2="${W-d}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eceff1"/><text x="${g-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="#78909c">${k(v)}</text>`).join('')}
   ${ref!==null?`<line x1="${g}" x2="${W-d}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="#c62828" stroke-dasharray="4 4"/><text x="${W-d}" y="${Y(ref)-4}" font-size="9" text-anchor="end" fill="#c62828">référence ${k(ref)}</text>`:''}
   <polyline points="${pts}" fill="none" stroke="#2e7d32" stroke-width="2"/>
   <circle cx="${X(S.length-1)}" cy="${Y(vals[vals.length-1])}" r="3.5" fill="#2e7d32"/>
   ${lab}</svg><div class="sub" style="font-size:11px;color:var(--doux)">Masse salariale chargée par mois (€) — dernier point : ${eur(vals[vals.length-1])} (${moisFr(S[S.length-1][0])})</div>`;}
function blocRef(){const r=D.rhRef;if(!r||!r[1]||num(r[1][1])===null||num(r[1][2])===null)return '';
  const m=r[1],bu=r[2]||[],h=r[3]||[],ec=r[4]||[];const baisse=num(m[3])<0;
  return `<div style="border-top:1px solid #e0e0e0;margin-top:8px;padding-top:8px"><div class="sub" style="font-size:12px;color:var(--doux)">${esc(r[5]&&r[5][0]||'')}</div>
    <div class="ligne"><span>Masse salariale / mois</span><b class="${baisse?'pos':'neg'}">${eur(m[2])} <span style="color:var(--doux);font-weight:400">vs ${eur(m[1])}</span></b></div>
    <div class="ligne"><span>Écart vs référence</span><b class="${baisse?'pos':'neg'}">${num(m[3])>0?'+':''}${eur(m[3])} (${pct(m[4],1)})</b></div>
    ${num(bu[1])!==null?`<div class="ligne"><span>Bulletins / mois</span><b>${(+bu[2]).toLocaleString('fr-FR',{maximumFractionDigits:1})} <span style="color:var(--doux);font-weight:400">vs ${(+bu[1]).toLocaleString('fr-FR',{maximumFractionDigits:1})}</span></b></div>`:''}
    ${num(h[1])!==null?`<div class="ligne"><span>Heures payées / mois</span><b>${ent(h[2])} <span style="color:var(--doux);font-weight:400">vs ${ent(h[1])}</span></b></div>`:''}
    ${num(ec[1])!==null?`<div class="ligne"><span>Économie cumulée</span><b class="${ec[1]>0?'pos':'neg'}">${eur(ec[1])}</b></div>`:''}${grapheMasse()}</div>`;}
function mois(){
  $('#ht').textContent='Performance mensuelle';
  const rh=D.perf.filter(p=>num(p['Masse salariale chargée N'])!==null).slice(-1)[0];
  const carteRh=rh?`<div class="carte"><div class="ligne"><span><b>Équipe — ${moisFr(rh['Mois'])}</b></span><span></span></div>
    <div class="ligne"><span>Masse salariale chargée</span><b>${eur(rh['Masse salariale chargée N'])}${num(rh['Masse salariale chargée N-1'])!==null?' <span style="color:var(--doux);font-weight:400">vs '+eur(rh['Masse salariale chargée N-1'])+'</span>':''}</b></div>
    <div class="ligne"><span>Masse salariale / marge</span><b class="${num(rh['Masse salariale / marge N'])!==null&&num(rh['Masse salariale / marge N-1'])!==null?(rh['Masse salariale / marge N']>rh['Masse salariale / marge N-1']?'neg':'pos'):''}">${pct(rh['Masse salariale / marge N'])}${num(rh['Masse salariale / marge N-1'])!==null?' <span style="color:var(--doux);font-weight:400">vs '+pct(rh['Masse salariale / marge N-1'])+'</span>':''}</b></div>
    <div class="ligne"><span>Marge par heure travaillée</span><b>${eur2(rh['Marge par heure N'])}</b></div>
    ${blocRef()}
    <button class="btn sec" id="bRh">🔒 Détail par collaborateur</button></div>`
    :`<div class="carte"><b>Équipe</b><div class="sub" style="font-size:13px;color:var(--doux)">Les indicateurs de masse salariale apparaîtront dès que l'onglet PAIE sera rempli.</div><button class="btn sec" id="bRh">🔒 Détail par collaborateur</button></div>`;
  $('#m').innerHTML=carteRh+blocOrga()+`<p class="titre">Fréquentation réelle = Ventes − 2 × recyclage</p>`+D.perf.map((p,i)=>`<div class="carte item" data-i="${i}">
   <div class="grow"><b style="text-transform:capitalize">${moisFr(p['Mois'])}</b><div class="sub">Marge ${eur(p['Marge € N'])} vs ${eur(p['Marge € N-1'])} · clients ${ent(p['Fréquentation réelle N'])} vs ${ent(p['Fréquentation réelle N-1'])}${num(p['Masse salariale / marge N'])!==null?' · salaires '+pct(p['Masse salariale / marge N'])+' de la marge':''}</div></div>
   <b class="${cls(p['Écart marge €'])}">${pct(p['Écart marge %'],1)}</b></div>`).join('');
  document.querySelectorAll('.item').forEach(e=>e.onclick=()=>formulaire('PERFORMANCE',D.perf[+e.dataset.i]));
  $('#bRh').onclick=()=>equipe();
  fab(null);
}

/* ---------- Détail RH : second code, jamais stocké durablement ---------- */
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
let PAIE=null, moisRh='';
const sansAcc=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const resp=n=>(D.equipe||[]).find(e=>sansAcc(e['Collaborateur'])===sansAcc(n));
function blocOrga(){const e=D.equipe||[];if(!e.length)return '';
  return `<div class="titre">L'équipe — qui fait quoi</div>${e.map(x=>`<div class="carte"><b>${esc(x['Collaborateur'])}</b> — ${esc(x['Titre']||'')}${x['Responsabilités']?`<div class="sub" style="font-size:12px;white-space:normal;margin-top:4px">🎯 ${esc(x['Responsabilités'])}</div>`:''}${x['Laboratoires référents']?`<div class="sub" style="font-size:12px;color:var(--doux)">Labos référents : ${esc(x['Laboratoires référents'])}</div>`:''}</div>`).join('')}`}
async function equipe(){
  $('#ht').textContent='Équipe 🔒'; fab(null);
  const code2=ss.get('pil_code2');
  if(!code2||!PAIE){
    $('#m').innerHTML=`<button class="btn sec" id="ret" style="margin:0 0 10px">← Performance</button><div class="carte"><p>Le détail des salaires est protégé par le <b>code RH</b> (différent du code de l'application).</p>
    <label>Code RH</label><input id="c2" type="password" autocomplete="off"><button class="btn" id="okRh">Déverrouiller</button></div>`;
    $('#ret').onclick=mois;
    $('#okRh').onclick=async()=>{const v=$('#c2').value.trim(); if(!v)return; if(await chargerPaie(v)){ss.set('pil_code2',v);equipe()}};
    if(code2&&!PAIE&&await chargerPaie(code2))equipe();
    return;
  }
  const lm=[...new Set(PAIE.map(r=>isoMois(r['Mois'])))].filter(Boolean).sort().reverse();
  if(!moisRh||!lm.includes(moisRh))moisRh=lm[0]||'';
  const l=PAIE.filter(r=>isoMois(r['Mois'])===moisRh).sort((a,b)=>(num(b['Coût employeur'])||0)-(num(a['Coût employeur'])||0));
  const t=k=>l.reduce((s,r)=>s+(num(r[k])||0),0);
  const L=(a,b)=>`<div class="ligne"><span>${a}</span><b>${b}</b></div>`;
  $('#m').innerHTML=`<button class="btn sec" id="ret" style="margin:0 0 10px">← Performance</button>
   <select id="selM">${lm.map(m=>`<option value="${esc(m)}" ${m===moisRh?'selected':''}>${moisFr(m)}</option>`).join('')}</select>
   <div class="carte" style="margin-top:10px">${L('Collaborateurs',l.length)}${L('Heures payées',ent(t('Heures payées')))}${L('Salaires bruts',eur(t('Salaire brut')))}${L('Coût employeur total',eur(t('Coût employeur')))}${L('Coût horaire moyen',t('Heures payées')?eur2(t('Coût employeur')/t('Heures payées')):'—')}</div>
   ${l.map(r=>{const q=resp(r['Collaborateur']);return `<div class="carte"><b>${esc(r['Collaborateur'])}</b>${q&&q['Titre']?' — '+esc(q['Titre']):''}<div class="sub" style="font-size:12px;color:var(--doux)">${esc([r['Fonction'],r['Contrat']].filter(Boolean).join(' · '))}</div>${q&&q['Responsabilités']?`<div class="sub" style="font-size:12px;white-space:normal;margin-top:4px">🎯 ${esc(q['Responsabilités'])}</div>`:''}
     ${L('Heures payées',ent(r['Heures payées']))}${L('Salaire brut',eur2(r['Salaire brut']))}${L('Coût employeur',eur2(r['Coût employeur']))}${L('Coût horaire',eur2(r['Coût horaire']))}</div>`}).join('')||'<p class="vide">Aucun bulletin pour ce mois.</p>'}
   <button class="btn sec" id="lock">🔒 Verrouiller</button>`;
  $('#ret').onclick=mois; $('#selM').onchange=e=>{moisRh=e.target.value;equipe()};
  $('#lock').onclick=()=>{ss.del('pil_code2');PAIE=null;mois();toast('Détail RH verrouillé')};
}
async function chargerPaie(code2){
  const c=cfg();
  try{const r=await fetch(c.url+'?code='+encodeURIComponent(c.code)+'&action=rh&code2='+encodeURIComponent(code2)+'&t='+Date.now());const j=await r.json();
    if(!j.ok){toast(j.err||'Erreur');ss.del('pil_code2');return false} PAIE=j.paie||[]; return true}
  catch(e){toast('Réseau indisponible');return false}
}

function fab(fn){let f=$('.fab'); if(f)f.remove(); if(!fn)return; f=document.createElement('button'); f.className='fab'; f.textContent='+'; f.onclick=fn; document.body.appendChild(f)}

/* ---------- Formulaire générique (champs saisissables uniquement) ---------- */
const LISTES={'Mise en place':'Oui / Non','Politique prix':'Politique prix','Statut prix':'Statut prix','Promo en cours':'Oui / Non','Type':"Type d'emplacement",'Zone / univers':'Zone / univers','Univers':'Zone / univers','Plateforme':'Plateforme écran','Position':'Position écran'};
const DATES=['Date repricing','Début','Fin','Préparer dès','Date export'];
const PCTS=['Remise avant %','Remises arrière % (info)'];
const NUMS=['Couverture stock (mois)','Commander sous (jours)','CA HT 12 mois','Marge € 12 mois','Marge € générée (période)','CA HT N','CA HT N-1','Marge € N','Marge € N-1','Ventes Vindilis N','Recyclage N','Ventes Vindilis N-1','Recyclage N-1','Objectif marge €'];
const CLES={OPERATIONS:'ID',LABORATOIRES:'Laboratoire',SURFACE_VENTE:'Code emplacement',ECRANS:'Code écran',PERFORMANCE:'Mois',CALENDRIER:'Événement',COMMANDES:'Laboratoire',EQUIPE:'Collaborateur',PRODUITS_ECRANS:'EAN'};
function formulaire(sheet,x){
  const champs=D.schema[sheet], cle=CLES[sheet], neuf=!x; x=x||{};
  $('#ht').textContent=neuf?'Nouveau':String(sheet==='PERFORMANCE'?moisFr(x[cle]):x[cle]);
  const champ=h=>{
    const v=x[h]??'', id='f_'+champs.indexOf(h), ro=(!neuf&&h===cle)?'disabled':'';
    if(h==='Laboratoire'&&sheet!=='LABORATOIRES') return `<label>${h}</label><select id="${id}" ${ro}><option value=""></option>${D.labos.map(l=>`<option ${l['Laboratoire']===v?'selected':''}>${esc(l['Laboratoire'])}</option>`).join('')}${v&&!D.labos.some(l=>l['Laboratoire']===v)?`<option selected>${esc(v)}</option>`:''}</select>`;
    if(LISTES[h]){const o=(D.refs[LISTES[h]]||[]); return `<label>${h}</label><select id="${id}"><option value=""></option>${o.map(s=>`<option ${s===v?'selected':''}>${esc(s)}</option>`).join('')}${v&&!o.includes(v)?`<option selected>${esc(v)}</option>`:''}</select>`}
    if(h==='Mois') return `<label>${h}</label><input id="${id}" type="month" value="${esc(isoMois(v).slice(0,7))}" ${ro}>`;
    if(DATES.includes(h)) return `<label>${h}</label><input id="${id}" type="date" value="${esc(v)}">`;
    if(PCTS.includes(h)) return `<label>${h} (en %)</label><input id="${id}" type="number" step="0.1" inputmode="decimal" value="${num(v)===null?'':+(v*100).toFixed(2)}">`;
    if(NUMS.includes(h)) return `<label>${h}</label><input id="${id}" type="number" step="any" inputmode="decimal" value="${esc(v)}">`;
    if(h==='Commentaire'||h==='Ordre de préparation'||h==='Catégories') return `<label>${h}</label><textarea id="${id}" rows="2">${esc(v)}</textarea>`;
    return `<label>${h}</label><input id="${id}" value="${esc(v)}" ${ro}>`;
  };
  const aide=sheet==='PERFORMANCE'?'<p class="sub" style="font-size:12px;color:var(--doux)">Ventes = colonne « Ventes » du comparatif jour Vindilis ; le recyclage est déduit deux fois automatiquement.</p>':'';
  $('#m').innerHTML=`<button class="btn sec" id="ret" style="margin:0 0 10px">← Retour</button><div class="carte">${aide}${champs.map(champ).join('')}
   <button class="btn" id="env">Enregistrer</button></div>`;
  $('#ret').onclick=()=>rendre(); fab(null);
  $('#env').onclick=async()=>{
    const row={};
    champs.forEach((h,i)=>{const e=$('#f_'+i); if(!e)return; let v=e.value.trim();
      if(h==='Mois'&&v)v=v+'-01';
      else if(PCTS.includes(h))v=v===''?'':Math.round(parseFloat(v.replace(',','.'))*100)/10000;
      else if(NUMS.includes(h))v=v===''?'':parseFloat(v.replace(',','.'));
      row[h]=v;});
    if(!row[cle]){toast('« '+cle+' » est obligatoire');return}
    if(PCTS.some(h=>(h in row)&&row[h]!==''&&(isNaN(row[h])||row[h]<0||row[h]>1))){toast('Remise : entre 0 et 100 %');return}
    if(NUMS.some(h=>(h in row)&&row[h]!==''&&isNaN(row[h]))){toast('Nombre invalide');return}
    $('#env').disabled=true; $('#env').textContent='Enregistrement…';
    if(await poster({action:'upsert',sheet,row})){toast('Enregistré — recommandations recalculées');await charger(true)}
    else{$('#env').disabled=false;$('#env').textContent='Enregistrer'}
  };
}

try{const c=ls.get('pil_cache'); if(c)D=JSON.parse(c)}catch(e){}

  history.replaceState(null,'','index.html');}catch(e){}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
