<html lang="fr">
<head>

<style>
:root{--vert:#1b5e20;--vert2:#2e7d32;--fond:#f4f6f5;--carte:#fff;--txt:#1d2622;--doux:#5f6b66;--ligne:#e1e6e3;--rouge:#c62828;--orange:#e65100;--bleu:#0d47a1;--violet:#4a148c;--rcl:#fdecea;--ocl:#fff4e0;--vcl:#e8f5e9;--bcl:#e3f2fd}

body{margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--txt);padding-bottom:calc(128px + env(safe-area-inset-bottom))}

header h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-size:14px}
#maj{font-size:11px;opacity:.85;white-space:nowrap}
main{padding:12px 16px;max-width:760px;margin:auto}
.fige{position:sticky;top:var(--hh,52px);z-index:4;background:var(--fond);margin:0 -16px;padding:8px 16px 2px;box-shadow:0 6px 8px -8px rgba(0,0,0,.35)}.fige>.carte{margin-top:0}.fige .titre{margin:6px 0 4px}
.leg{font-size:12px;color:var(--doux);white-space:normal;line-height:1.6}

.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--ligne);color:var(--txt)}
.p1{background:#ffcdd2;color:#b71c1c}.p2{background:#ffe0b2;color:#8a3b00}.p3{background:#e3f2fd;color:#0d47a1}
.A{background:#c8e6c9;color:#1b5e20}.B{background:#fff59d;color:#5d4b00}.C{background:#eceff1;color:#455a64}

input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--ligne);border-radius:8px;background:var(--fond);color:var(--txt)}
label{display:block;font-size:12px;color:var(--doux);margin:10px 0 4px}

.diag{border-left:4px solid var(--orange);font-weight:600}

#toast.on{opacity:1}

.barre{height:10px;border-radius:5px;background:var(--ligne);overflow:hidden;margin:8px 0 4px;position:relative}.barre i{display:block;height:100%;background:var(--vert2)}
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tuile{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer}.tuile b{display:block;font-size:22px}.tuile span{font-size:11px;color:var(--doux)}

.al b.t{display:block;margin-bottom:3px}
.ordre{white-space:pre-line;font-size:13px;margin-top:8px;padding:8px 10px;background:var(--fond);border-radius:8px}
.fab{position:fixed;right:18px;bottom:calc(122px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--vert2);color:#fff;font-size:28px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.tw{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--doux);text-align:left;padding:6px 6px;border-bottom:2px solid var(--ligne);white-space:nowrap}
table.t td{padding:6px 6px;border-bottom:1px solid var(--ligne);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--ligne)}
.gros{font-size:28px;font-weight:800;line-height:1.1}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{width:22px;height:22px;flex:none;margin-top:2px}
.fait{opacity:.55}.fait .grow b{text-decoration:line-through}
.pt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.split>*{min-width:0}
.planbox{overflow-x:auto;margin-bottom:10px;border:1px solid var(--ligne);border-radius:12px}.splitplan>*{min-width:0}
.lien{color:var(--vert2);font-weight:600;cursor:pointer;text-decoration:underline}
.donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}.donut svg{flex:none}
.leg2{display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}.leg2.lig{flex-direction:row;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--doux)}
.clic{cursor:pointer}.leg2 .clic:hover,.bh.clic:hover .bhl{color:var(--vert2);text-decoration:underline}
.bhs{margin-top:8px;display:flex;flex-direction:column;gap:6px}.bh{display:grid;grid-template-columns:minmax(90px,36%) 1fr minmax(38px,auto);gap:8px;align-items:center;font-size:12.5px}
.bhl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bhb{display:flex;height:16px;border-radius:4px;background:var(--fond);overflow:hidden}.bhb i{display:block;height:100%}.bhv{text-align:right;font-variant-numeric:tabular-nums;color:var(--doux)}
.tdb{display:grid;grid-template-columns:1fr;gap:0;align-items:stretch}
.suivi{margin-top:8px;border-top:1px dashed var(--ligne);padding-top:6px}.suivi summary{cursor:pointer;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.mini{border:1px solid var(--vert2);background:none;color:var(--vert2);border-radius:14px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.blocact{border-left:5px solid var(--vert2)}.blocact>summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;list-style:none}.blocact>summary::-webkit-details-marker{display:none}
.blocact>summary::after{content:"▾";margin-left:auto;color:var(--doux)}.blocact[open]>summary::after{content:"▴"}
.ba-t{font-weight:700}.ba-c{font-size:12.5px;color:var(--doux)}.ba-b{flex-basis:100%;height:6px;border-radius:3px;background:var(--ligne);overflow:hidden}.ba-b i{display:block;height:100%;background:var(--vert2)}
.ba-l{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--ligne);font-size:13.5px;cursor:pointer}.ba-l:hover{background:var(--fond)}.ba-l .grow{flex:1;min-width:0}
.sig{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:7px 9px;margin:8px 0 2px;border-radius:8px;background:var(--ocl);font-size:13px}
.ba-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.semaine{display:grid;grid-template-columns:1fr;gap:0;align-items:start}
.flash{animation:fl 1.6s ease-out}@keyframes fl{0%{box-shadow:0 0 0 4px var(--vert2)}100%{box-shadow:0 0 0 0 transparent}}
.voile{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panneau{background:var(--fond);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:1024px){.voile{align-items:center}.panneau{border-radius:16px}}
#bMsg{position:relative}#bMsg .bn{position:absolute;top:-5px;right:-6px;background:var(--orange);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
.jauge{margin:12px 0 4px}.jg-b{position:relative;height:18px;border-radius:9px;background:var(--fond);border:1px solid var(--ligne);overflow:visible}
.jg-r{position:absolute;left:0;top:0;bottom:0;background:var(--vert2);border-radius:9px 0 0 9px}.jg-p{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(46,125,50,.45) 0 5px,transparent 5px 9px)}
.jg-m{position:absolute;top:-5px;bottom:-5px;border-left:3px solid}.jg-l{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin-top:8px}
/* --- Version ordinateur (même adresse, mêmes données) --- */
@media (min-width:1024px){
body{padding:0 0 30px 236px}
header{padding:14px 28px}header h1{font-size:20px}.fige{margin:0 -28px;padding:10px 28px 2px}
nav{top:0;bottom:0;right:auto;width:236px;display:flex;flex-direction:column;border-top:0;border-right:1px solid var(--ligne);padding:70px 10px 10px;gap:2px}
nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;min-height:44px;padding:8px 14px;border-radius:10px;cursor:pointer;text-align:left}

nav button .sc{display:none}nav button .lc{display:inline}

nav::before{content:"Pilotage pharmacie";position:absolute;top:22px;left:24px;font-weight:800;color:var(--vert2);font-size:16px}
main{max-width:1500px;padding:20px 28px;display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:0 16px;align-items:start}
main>*{grid-column:1/-1}
main>.item,main>.reco,main>.op,main>.demi{grid-column:auto}

.splitplan{display:grid;grid-template-columns:minmax(0,2fr) minmax(320px,1fr);gap:16px;align-items:start}.planbox svg{min-width:0!important}
.split>.gauche{position:sticky;top:80px;max-height:calc(100vh - 100px);overflow:auto}

}
nav button em{font-style:normal}
</style>

<body>
<header><h1 id="ht">Pilotage</h1><span id="maj"></span><button id="bMsg" aria-label="Laisser une remarque ou une idée" onclick="panneauMsg()">💬</button><button id="bCfg" aria-label="Réglages" onclick="reglages()">⚙</button><button id="bRef" aria-label="Actualiser">↻</button></header>
<main id="m"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
'use strict';
const APP_V='4.0';
const ONGLETS=[['acc','🎯','Accueil','Accueil'],['act','✅','Actions','Actions'],['lab','🧪','Labos & prix','Labos'],['pro','🏷️','Promos','Promos'],['stk','📦','Stock & commandes','Stock'],['eve','📅','Événements','Évén.'],['ecr','📺','Écrans & réseaux','Écrans'],['con','🏁','Concurrence','Concur.'],['col','👥','Collaborateurs','Équipe'],['mois','🎯','Objectifs & mois','Objectifs']];
let D=null,vue='acc',filtre='Classement',recherche='',filtreLab='Tous',voirPasses=false,filtreOps=0;
const $=s=>document.querySelector(s);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>(v===''||v===null||v===undefined||isNaN(+v))?null:+v;
const eur=v=>num(v)===null?'—':Math.round(+v).toLocaleString('fr-FR')+' €';
const eur2=v=>num(v)===null?'—':(+v).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const ent=v=>num(v)===null?'—':Math.round(+v).toLocaleString('fr-FR');
const pct=(v,s)=>num(v)===null?'—':((s&&v>0?'+':'')+(v*100).toLocaleString('fr-FR',{maximumFractionDigits:1})+' %');
const dfr=v=>{if(!v)return '—';const p=String(v).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v};
const isoMois=v=>{if(v===null||v===undefined||v==='')return '';const n=Number(v);if(isFinite(n)&&n>20000){const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5);return d.toISOString().slice(0,10)}return String(v)};
const moisFr=v=>{const s=isoMois(v);if(!/^\d{4}-\d{2}/.test(s))return s||'—';const p=s.split('-');const d=new Date(+p[0],+p[1]-1,15);return d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})};
const cls=v=>num(v)===null?'':(v<0?'neg':'pos');

const COUL={'Urgent':['#ffcdd2','#b71c1c'],'Cette semaine':['#ffe0b2','#8a3b00'],'À surveiller':['#e3f2fd','#0d47a1'],'En cours':['#ffcdd2','#b71c1c'],'À préparer':['#ffe0b2','#8a3b00'],'À venir':['#e3f2fd','#0d47a1'],'Passé':['#eceff1','#78909c']};
const bdg=t=>{const c=COUL[t];return `<span class="badge" ${c?`style="background:${c[0]};color:${c[1]}"`:''}>${esc(t)}</span>`};
const auj=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const jours=v=>{if(!v||!/^\d{4}-\d{2}-\d{2}/.test(v))return null;const a=new Date(String(v).slice(0,10)+'T12:00:00'),b=new Date(auj()+'T12:00:00');return Math.round((b-a)/864e5)};
/* Statut prix d'un laboratoire : icône + libellé + groupe de filtre */
function etatPrix(x){const pol=x['Politique prix']||'',st=x['Statut prix']||'';
  if(pol==='Imposé')return ['🔒','Prix imposé','Imposé'];
  if(st==='Fait')return ['✅','Prix à jour','Fait'];
  if(st==='À valider')return ['🟠','À valider','À valider'];
  if(st==='À revoir'||st==='À importer')return ['🟡',st,'À revoir'];
  if(st==='En cours')return ['🔵','En cours','À valider'];
  if(st==='À faire')return ['⭕','À faire','À faire'];
  if(pol==='Administré')return ['➖','Hors périmètre (remboursé)','Hors périmètre'];
  return ['❔','À préciser','À faire'];}
const P=k=>D&&D.params?num(D.params[k]):null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)}

/* ---------- API ---------- */
const URL_DEF='https://script.google.com/macros/s/AKfycbyQvb6qxIQ9Z1Ah97F7UouUwmqRiXNDCr1YLzgZ7afWpVDUKwWy8KVb32nVSwM-Z0oiyg/exec';
const cfg=()=>({url:ls.get('pil_url')||URL_DEF,code:ls.get('pil_code')||''});
let enCours=false,derniereErreur='';
async function charger(silencieux){
  const c=cfg(); if(!c.url||!c.code){derniereErreur='Saisissez votre code d\'accès.';reglages();return}
  if(!silencieux)toast('Actualisation…');
  enCours=true; if(!D)$('#m').innerHTML='<p class="vide">Chargement…</p>';
  try{
    const r=await fetch(c.url+'?code='+encodeURIComponent(c.code)+'&t='+Date.now());
    const j=await r.json();
    enCours=false;
    if(!j.ok){derniereErreur=j.err||'Erreur';toast(derniereErreur);if(/Code/.test(j.err||'')||!D)reglages();return}
    derniereErreur=''; D=j; ls.set('pil_cache',JSON.stringify(j)); if(vue==='cfg')vue='acc'; rendre(); if(!silencieux)toast('À jour'); chargerAudit();
  }catch(e){enCours=false;derniereErreur='Connexion impossible au serveur ('+(e&&e.message||e)+').';if(D)toast('Hors ligne : dernières données affichées');else{toast('Connexion impossible');reglages();}}
}
async function poster(body){
  const c=cfg();
  try{
    const r=await fetch(c.url,{method:'POST',body:JSON.stringify(Object.assign({code:c.code},body))});
    const j=await r.json(); if(!j.ok){toast(j.err||'Erreur');return false} return true;
  }catch(e){toast('Échec de l\'envoi (réseau)');return false}
}

/* ---------- Réglages ---------- */
function reglages(){
  const c=cfg(); $('#ht').textContent='Réglages'; fab(null);
  $('#m').innerHTML=`${derniereErreur?`<div class="carte" style="border-left:4px solid #c62828"><b>⚠ ${esc(derniereErreur)}</b></div>`:''}<div class="carte"><p>Saisissez votre code d'accès puis touchez « Enregistrer ». L'adresse est déjà remplie : n'y touchez pas.</p>
  <label>Adresse de l'application Web</label><input id="u" value="${esc(c.url)}" placeholder="https://script.google.com/macros/s/…/exec">
  <label>Code d'accès</label><input id="c" type="password" inputmode="numeric" value="${esc(c.code)}">

  <div class="carte"><b>Analyses (Vindilis, GERS, recommandes, promotions)</b><div class="sub w" style="margin-top:4px">${A?'Arrêtées au '+esc(A.majLib)+'. Sources : '+esc(A.sources):esc(auditErr||'Non chargées.')} Ces données sont chiffrées avec votre code d'accès.</div><button class="btn sec" id="bAud">Recharger les analyses</button></div>

let A=null,auditErr='';
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dechiffrer(o,code){const te=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',te.encode(code),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(o.salt),iterations:o.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},k,b64d(o.data));
  if(o.gz){const st=new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(st).text())}
  return JSON.parse(new TextDecoder().decode(pt))}

/* ---------- SUIVI DES ACTIONS : statut, mise en place, mesure avant / après, verdict (partagé via ETAT) ---------- */
const NOM_ONG=Object.fromEntries(ONGLETS.map(o=>[o[0],o[2]]));
const THEMES_DEF=['Stock & commandes','Prix & promotions','Événements & écrans','Merchandising','Concurrence & clients','Équipe','Réseaux sociaux','Application'];
const actPerso=()=>{try{return JSON.parse(ETAT.actx||'[]')}catch(e){return []}};
const toutes=()=>(A?A.actions:[]).concat(actPerso());
const suivi=id=>{try{return JSON.parse(ETAT['acts_'+id]||'{}')}catch(e){return {}}};
const ajJ=(d,n)=>{if(!d||!/^\d{4}-\d{2}-\d{2}/.test(d))return '';const x=new Date(d.slice(0,10)+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const dateMesure=a=>{const s=suivi(a.id);return s.dmes||ajJ(s.debut||a.quand,14)};
function statutA(a){if(actFaite(a.id))return 'faite';const j=jours(a.quand);if(j!==null&&j>0)return 'retard';return suivi(a.id).st==='encours'?'encours':'afaire'}
const aMesurer=a=>actFaite(a.id)&&!suivi(a.id).verdict&&a.mesure&&a.mesure!=='—'&&(jours(dateMesure(a))??-1)>=0;
const ST={faite:['Faite','var(--vert2)','✅'],encours:['En cours','var(--bleu)','🔵'],afaire:['À faire','#90a4ae','⭕'],retard:['En retard','var(--rouge)','⏰']};
const VD={garder:['On garde','var(--vert2)','✅'],corriger:['À corriger','var(--orange)','🟠'],arreter:['On arrête','var(--rouge)','⛔']};
const ongletA=a=>String(a.go||'act').split(':')[0];
const actsOnglet=t=>toutes().filter(a=>ongletA(a)===t||(t==='mois'&&ongletA(a)==='col'));

/* Graphiques SVG / HTML, sans bibliothèque */
function donut(parts,centre,sous,taille){taille=taille||150;const T=parts.reduce((s,p)=>s+p[1],0),r=52,C=2*Math.PI*r,v=parts.filter(p=>p[1]>0);let off=0;
  const gap=v.length>1?1.2:0;
  const segs=T?v.map(p=>{const l=p[1]/T*C;const s=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${p[2]}" stroke-width="22" stroke-dasharray="${Math.max(l-gap,0.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(p[0])} : ${p[1]}</title></circle>`;off+=l;return s}).join(''):`<circle r="${r}" cx="70" cy="70" fill="none" stroke="var(--ligne)" stroke-width="22"/>`;
  return `<div class="donut"><svg viewBox="0 0 140 140" width="${taille}" height="${taille}" role="img" aria-label="${esc(sous||'')}">${segs}<text x="70" y="72" text-anchor="middle" font-size="${String(centre).length>7?14:String(centre).length>5?17:24}" font-weight="800" fill="var(--txt)">${esc(centre)}</text><text x="70" y="90" text-anchor="middle" font-size="10" fill="var(--doux)">${esc(sous||'')}</text></svg>
   <div class="leg2">${parts.map(p=>`<div ${p[3]?`data-f2="${esc(p[3])}" class="clic"`:''}><span class="pt" style="background:${p[2]}"></span>${esc(p[0])} <b>${typeof p[4]==='string'?p[4]:p[1]}</b>${T&&p[4]===undefined?` <span class="sub">${Math.round(p[1]/T*100)} %</span>`:''}</div>`).join('')}</div></div>`}
function barresH(rows,max){max=max||Math.max(1,...rows.map(r=>r[1].reduce((s,x)=>s+x[0],0)));
  return `<div class="bhs">${rows.map(r=>`<div class="bh ${r[2]?'clic':''}" ${r[2]?`data-th="${esc(r[2])}"`:''}><div class="bhl" title="${esc(r[0])}">${esc(r[0])}</div><div class="bhb">${r[1].map(x=>x[0]>0?`<i style="width:${(x[0]/max*100).toFixed(2)}%;background:${x[1]}" title="${esc(x[2]||'')}"></i>`:'').join('')}</div><div class="bhv">${r[3]??''}</div></div>`).join('')}</div>`}
const legende=L=>`<div class="leg2 lig">${L.map(x=>`<span><span class="pt" style="background:${x[1]}"></span>${esc(x[0])}</span>`).join('')}</div>`;

/* Tableau de bord du plan : statuts, thèmes, verdicts, échéances */
function tableauPlan(L){const n=k=>L.filter(a=>statutA(a)===k).length,F=L.filter(a=>actFaite(a.id));
  const nv=k=>F.filter(a=>suivi(a.id).verdict===k).length,nm=F.filter(a=>!suivi(a.id).verdict).length;
  const pc=L.length?Math.round(F.length/L.length*100):0;
  const TH=[...new Set(THEMES_DEF.concat(L.map(a=>a.theme||'Autres')))].filter(t=>L.some(a=>(a.theme||'Autres')===t));
  const th=TH.map(t=>{const l=L.filter(a=>(a.theme||'Autres')===t),c=k=>l.filter(a=>statutA(a)===k).length;return [t,[[c('faite'),ST.faite[1],'faites'],[c('encours'),ST.encours[1],'en cours'],[c('retard'),ST.retard[1],'en retard'],[c('afaire'),ST.afaire[1],'à faire']],t,`${c('faite')}/${l.length}`]});
  const sem=[0,1,2,3,4,5].map(i=>{const d0=ajJ(auj(),i*7),d1=ajJ(auj(),i*7+6);const l=L.filter(a=>!actFaite(a.id)&&(i===0?String(a.quand)<=d1:String(a.quand)>=d0&&String(a.quand)<=d1));return [i===0?'Cette semaine (+ retards)':'Sem. du '+dfr(d0).slice(0,5),[[l.filter(a=>statutA(a)==='retard').length,ST.retard[1],'en retard'],[l.filter(a=>statutA(a)!=='retard').length,'var(--vert2)','prévues']],'',String(l.length)]});
  return `<div class="tdb">
   <div class="carte"><b>Où en est le plan</b><div class="sub">Touchez une part pour filtrer</div>${donut([[ST.faite[0]+'s',n('faite'),ST.faite[1],'Faites'],[ST.encours[0],n('encours'),ST.encours[1],'En cours'],[ST.retard[0],n('retard'),ST.retard[1],'En retard'],[ST.afaire[0],n('afaire'),ST.afaire[1],'À faire']],pc+' %','faites sur '+L.length)}</div>
   <div class="carte"><b>Ce que donnent les actions faites</b><div class="sub">Verdict après la mesure avant / après</div>${donut([[VD.garder[0],nv('garder'),VD.garder[1],'Garder'],[VD.corriger[0],nv('corriger'),VD.corriger[1],'Corriger'],[VD.arreter[0],nv('arreter'),VD.arreter[1],'Arrêter'],['Pas encore mesurées',nm,'#cfd8dc','À mesurer']],String(F.length),'actions faites')}</div>
   <div class="carte tdb-l"><b>Par thème</b> <span class="sub">(touchez un thème)</span>${barresH(th)}${legende([['Faites',ST.faite[1]],['En cours',ST.encours[1]],['En retard',ST.retard[1]],['À faire',ST.afaire[1]]])}</div>
   <div class="carte tdb-l"><b>Échéances des 6 prochaines semaines</b>${barresH(sem)}${legende([['En retard',ST.retard[1]],['Prévues','var(--vert2)']])}</div></div>`}

/* Fiche de suivi d'une action */
function blocSuivi(a){const s=suivi(a.id),st=statutA(a),f=actFaite(a.id);
  return `<details class="suivi" ${s.verdict||s.avant||s.st==='encours'?'':''}><summary><b>📏 Suivi et mesure</b>${s.debut?` · mise en place le ${dfr(s.debut)}`:''}${f&&!s.verdict?` · <span class="${aMesurer(a)?'neg':''}">mesure le ${dfr(dateMesure(a))}</span>`:''}</summary>
   <div class="statuts" data-sid="${esc(a.id)}">${[['afaire','À faire'],['encours','En cours'],['faite','Faite']].map(k=>`<button data-st="${k[0]}" class="${(k[0]==='faite'?f:!f&&(k[0]==='encours'?s.st==='encours':s.st!=='encours'))?'on':''}">${k[1]}</button>`).join('')}</div>
   <div class="g2"><div><label>Mise en place le</label><input type="date" data-k="debut" value="${esc(s.debut||'')}"></div><div><label>Mesure prévue le</label><input type="date" data-k="dmes" value="${esc(s.dmes||ajJ(s.debut||a.quand,14))}"></div>
   <div><label>Chiffre avant</label><input data-k="avant" value="${esc(s.avant||'')}" placeholder="ex. 12 ventes / sem."></div><div><label>Chiffre après</label><input data-k="apres" value="${esc(s.apres||'')}" placeholder="ex. 19 ventes / sem."></div></div>
   <label>Verdict</label><div class="statuts" data-vid="${esc(a.id)}">${Object.entries(VD).map(([k,v])=>`<button data-vd="${k}" class="${s.verdict===k?'on':''}" style="${s.verdict===k?`background:${v[1]};border-color:${v[1]}`:''}">${v[2]} ${v[0]}</button>`).join('')}</div>
   <label>Note</label><textarea data-k="note" rows="2" placeholder="Ce qui a été fait, ce qu'on change">${esc(s.note||'')}</textarea>
   <button class="btn" data-save="${esc(a.id)}" style="margin-top:10px">Enregistrer le suivi</button>${a.perso?`<button class="btn sec" data-del="${esc(a.id)}" style="margin-top:8px">Retirer cette action ajoutée</button>`:''}</details>`}
function puce(a){const st=statutA(a),s=suivi(a.id),v=VD[s.verdict];
  return `<span class="badge" style="background:${ST[st][1]};color:#fff">${ST[st][2]} ${ST[st][0]}</span>${v?` <span class="badge" style="background:${v[1]};color:#fff">${v[2]} ${v[0]}</span>`:''}${aMesurer(a)?' <span class="badge" style="background:var(--orange);color:#fff">📏 À mesurer</span>':''}${a.perso?' <span class="badge">Ajoutée</span>':''}`}
async function enregistrerSuivi(id,box,maj){const s=suivi(id);box.querySelectorAll('[data-k]').forEach(i=>{if(i.dataset.k==='dmes'&&!s.dmes&&i.value===i.defaultValue)return;s[i.dataset.k]=i.value.trim()});
  const vb=box.querySelector('[data-vd].on');s.verdict=vb?vb.dataset.vd:'';const sb=box.querySelector('[data-st].on');const st=sb?sb.dataset.st:'afaire';
  s.st=st==='encours'?'encours':'';if(st!=='afaire'&&!s.debut)s.debut=auj();if(!s.dmes||s.dmes===ajJ(s.debut||'',14))delete s.dmes;s.maj=auj();
  const ok1=await majEtat('acts_'+id,JSON.stringify(s));const fv=st==='faite'?'1':'0';let ok2=true;if((ETAT['act_'+id]==='1')!==(fv==='1')){ls.set('pil_act_'+id,fv);ok2=await majEtat('act_'+id,fv)}
  toast(ok1&&ok2?'Suivi enregistré — visible sur tous vos appareils':'Non enregistré (réseau) : réessayez');if(maj)maj()}
function brancherSuivi(maj){
  document.querySelectorAll('.suivi .statuts button').forEach(b=>b.onclick=e=>{e.preventDefault();const p=b.parentElement;const on=b.classList.contains('on');p.querySelectorAll('button').forEach(x=>{x.classList.remove('on');x.style.background='';x.style.borderColor=''});if(!(p.dataset.vid&&on)){b.classList.add('on');if(b.dataset.vd){const c=VD[b.dataset.vd][1];b.style.background=c;b.style.borderColor=c}}});
  document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>enregistrerSuivi(b.dataset.save,b.closest('.suivi'),maj));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const L=actPerso().filter(x=>x.id!==b.dataset.del);if(await majEtat('actx',JSON.stringify(L)))toast('Action retirée');maj()});}

/* Ajouter une action depuis n'importe quel onglet (ou depuis un signal de données) */
function formAction(pre,retour){pre=pre||{};fab(null);const og=pre.go||vue;
  $('#m').innerHTML=`<div class="carte"><b>Nouvelle action</b><div class="sub w">Elle s'ajoute au plan d'action global et dans l'onglet choisi, avec son suivi avant / après.</div>
   <label>Action</label><input id="na_t" value="${esc(pre.titre||'')}" placeholder="Ce qu'il faut faire">
   <div class="g2"><div><label>Thème</label><select id="na_th">${THEMES_DEF.map(t=>`<option ${t===(pre.theme||'')?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
   <div><label>Onglet</label><select id="na_g">${ONGLETS.filter(o=>o[0]!=='act').map(o=>`<option value="${o[0]}" ${o[0]===og?'selected':''}>${esc(o[2])}</option>`).join('')}</select></div>
   <div><label>Qui (fonction)</label><input id="na_q" value="${esc(pre.qui||'Titulaire')}"></div><div><label>Pour le</label><input id="na_d" type="date" value="${esc(pre.quand||ajJ(auj(),7))}"></div></div>
   <label>Pourquoi (enjeu)</label><input id="na_e" value="${esc(pre.enjeu||'')}">
   <label>Comment on mesure avant / après</label><input id="na_m" value="${esc(pre.mesure||'')}" placeholder="ex. ventes du produit 7 jours avant / 7 jours après">
   <button class="btn" id="na_ok">Ajouter au plan</button><button class="btn sec" id="na_ko">Annuler</button></div>`;
  $('#na_ko').onclick=retour;
  $('#na_ok').onclick=async()=>{const t=$('#na_t').value.trim();if(!t){toast('Indiquez l\'action');return}
    const L=actPerso(),n=L.reduce((m,x)=>Math.max(m,+String(x.id).slice(1)||0),0)+1;
    L.push({id:'P'+n,perso:1,theme:$('#na_th').value,titre:t,qui:$('#na_q').value.trim(),quand:$('#na_d').value,enjeu:$('#na_e').value.trim()||'—',etapes:[],mesure:$('#na_m').value.trim()||'—',go:$('#na_g').value,cree:auj()});
    if(await majEtat('actx',JSON.stringify(L))){toast('Action P'+n+' ajoutée au plan');retour()}}}

/* Signaux tirés des données de chaque onglet → proposition d'action */
function signaux(t){if(!A)return [];const S=[];
  if(t==='stk'){const b=A.stock.filter(s=>s.decision==='commander');if(b.length)S.push({lie:'A2',txt:b.length+' laboratoire(s) à commander : '+b.map(s=>s.nom).join(', ')+' ('+eur(b.reduce((s,x)=>s+x.margePerdue,0))+' de marge perdue / mois)',pre:{theme:'Stock & commandes',titre:'Commander '+b.map(s=>s.nom).join(' et '),enjeu:eur(b.reduce((s,x)=>s+x.margePerdue,0))+' / mois de marge perdue',mesure:'Ruptures et marge du laboratoire 15 jours avant / après la réception',go:'stk'}});
    const bl=A.stock.filter(s=>s.decision==='bloque');if(bl.length)S.push({lie:'A3',txt:bl.length+' commande(s) bloquée(s) à débloquer ou réduire',pre:{theme:'Stock & commandes',titre:'Débloquer les commandes en attente : '+bl.map(s=>s.nom).slice(0,4).join(', '),mesure:'Montant en attente avant / après',go:'stk'}})}
  if(t==='pro'){if(A.opeazManquantes.length)S.push({lie:'A5',txt:A.opeazManquantes.length+' opération(s) Opeaz sans promotion dans Vindilis',pre:{theme:'Prix & promotions',titre:'Créer dans Vindilis les promotions Opeaz manquantes',mesure:'Ventes au prix promo 7 jours avant / après',go:'pro'}});
    const W=A.pourquoi;if(W&&W.zero&&W.zero.length)S.push({lie:'A12',txt:W.zero.length+' promotion(s) actives sans aucune vente',pre:{theme:'Prix & promotions',titre:'Rendre visibles en rayon les promotions sans vente',mesure:'Ventes au prix promo 7 jours avant / après la mise en avant',go:'pro'}})}
  if(t==='lab'){const r=(D.recos||[]).filter(ouverte);if(r.length)S.push({txt:r.length+' recommandation(s) automatique(s) ouverte(s) sur les laboratoires',go:'act:rec'})}
  if(t==='ecr'&&A.reseaux&&A.reseaux.instagram){const p=A.reseaux.instagram.posts||[];const d=p.map(x=>x.date).filter(Boolean).sort().pop();const j=d?jours(String(d).slice(0,10)):null;if(j!==null&&j>7)S.push({lie:'A41',txt:'Dernière publication Instagram il y a '+j+' jours (objectif : 3 par semaine)',pre:{theme:'Réseaux sociaux',titre:'Programmer les 3 publications de la semaine',mesure:'Vues et ventes du produit montré 7 jours avant / après',go:'ecr'}})}
  return S}

/* Bloc « Actions de cet onglet », posé en tête de chaque onglet */
const BLOC_ONG=['lab','pro','stk','eve','ecr','con','col','mois'];
function blocActions(t){const L=actsOnglet(t),c=k=>L.filter(a=>statutA(a)===k).length,f=c('faite'),S=signaux(t);
  const ouv=ls.get('pil_bloc_'+t);const open=ouv===null?innerWidth>=1024:ouv==='1';
  const ord=L.slice().sort((a,b)=>({retard:0,encours:1,afaire:2,faite:3}[statutA(a)]-{retard:0,encours:1,afaire:2,faite:3}[statutA(b)])||String(a.quand).localeCompare(String(b.quand)));
  return `<details class="carte blocact" id="blocAct" data-t="${t}" ${open?'open':''}><summary><span class="ba-t">📌 Actions de cet onglet</span>
   <span class="ba-c">${c('retard')?`<b class="neg">${c('retard')} en retard</b> · `:''}${c('afaire')+c('encours')} à faire · ${f}/${L.length} faites${S.length?` · <b style="color:var(--orange)">${S.length} signal${S.length>1?'s':''}</b>`:''}</span>
   <span class="ba-b"><i style="width:${L.length?Math.round(f/L.length*100):0}%"></i></span></summary>
   ${S.map((s,i)=>{const la=s.lie&&toutes().find(a=>a.id===s.lie);return `<div class="sig"><span>⚡ ${esc(s.txt)}${la?`<span class="sub" style="display:block">Déjà dans le plan : <b>${esc(la.id)}</b> · ${ST[statutA(la)][2]} ${ST[statutA(la)][0]}</span>`:''}</span>${la?`<button class="mini" data-ouvre="${esc(la.id)}">Suivre ${esc(la.id)}</button>`:s.pre?`<button class="mini" data-sig="${i}">Créer l'action</button>`:`<button class="mini" data-go="${s.go}">Voir</button>`}</div>`}).join('')}
   ${(()=>{const li=a=>`<div class="ba-l" data-ouvre="${esc(a.id)}"><span class="pt" style="background:${ST[statutA(a)][1]}"></span><span class="grow"><b>${esc(a.id)}</b> ${esc(a.titre)}<span class="sub"> · ${esc(a.qui)} · ${dfr(a.quand)}</span></span>${suivi(a.id).verdict?`<span title="${VD[suivi(a.id).verdict][0]}">${VD[suivi(a.id).verdict][2]}</span>`:aMesurer(a)?'<span title="À mesurer">📏</span>':''}</div>`;return ord.slice(0,6).map(li).join('')+(ord.length>6?`<details><summary class="sub" style="cursor:pointer;padding:6px 0">Voir les ${ord.length-6} autres actions</summary>${ord.slice(6).map(li).join('')}</details>`:'')})()}
   ${ord.length?'':'<div class="sub">Aucune action rattachée à cet onglet pour l\'instant.</div>'}
   <div class="ba-btn"><button class="mini" id="baPlan">Voir dans le plan d'action ›</button><button class="mini" id="baAdd">+ Ajouter une action</button></div></details>`}
function injecterBloc(){const m=$('#m');if(!m||!A||!BLOC_ONG.includes(vue)||document.getElementById('blocAct'))return;
  if(!m.firstElementChild||/^Chargement/.test(m.textContent.trim())||document.getElementById('na_t'))return;
  const t=vue,first=m.firstElementChild;const html=blocActions(t);
  if(first&&first.classList.contains('filtres'))first.insertAdjacentHTML('afterend',html);else if(first&&first.id==='ret')first.insertAdjacentHTML('afterend',html);else m.insertAdjacentHTML('afterbegin',html);
  const b=document.getElementById('blocAct');const retour=()=>{vue=t;rendre();scrollTo(0,0)};
  b.ontoggle=()=>ls.set('pil_bloc_'+t,b.open?'1':'0');
  b.querySelectorAll('[data-ouvre]').forEach(e=>e.onclick=()=>{ouvrirAction(e.dataset.ouvre)});
  b.querySelectorAll('[data-sig]').forEach(e=>e.onclick=()=>formAction(signaux(t)[+e.dataset.sig].pre,retour));
  b.querySelectorAll('[data-go]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const p=e.dataset.go.split(':');vue=p[0];if(p[1]&&vue==='act'){sousAct=p[1]==='rec'?'rec':p[1];if(p[1]==='rec')filtre='Ouvertes'}rendre();scrollTo(0,0)});
  $('#baPlan').onclick=()=>{filtreOng=t;filtreTh='Tous';filtreSt='Toutes';sousAct='dix';vue='act';rendre();scrollTo(0,0)};
  $('#baAdd').onclick=()=>formAction({go:t},retour);}
function ouvrirAction(id){filtreOng='';filtreTh='Tous';filtreSt='Toutes';sousAct='dix';vue='act';focusAct=id;rendre();
  setTimeout(()=>{const e=document.getElementById('act-'+id);if(e){e.scrollIntoView({behavior:'smooth',block:'start'});e.classList.add('flash');const d=e.querySelector('details.suivi');if(d)d.open=true}focusAct=''},60)}
let filtreOng='',focusAct='';
new MutationObserver(()=>injecterBloc()).observe(document.getElementById('m'),{childList:true});

/* Accueil : le plan en un coup d'œil + ce qui tombe cette semaine */
function carteSemaine(){if(!A)return '';const L=toutes(),re=L.filter(a=>statutA(a)==='retard'),se=L.filter(a=>!actFaite(a.id)&&statutA(a)!=='retard'&&(jours(a.quand)??1)<=0&&(jours(a.quand)??0)>=-6),me=L.filter(aMesurer);
  const n=k=>L.filter(a=>statutA(a)===k).length,F=L.filter(a=>actFaite(a.id)).length;
  const lig=(a,lib,c)=>`<div class="ba-l" data-ouvre="${esc(a.id)}"><span class="pt" style="background:${c}"></span><span class="grow"><b>${esc(a.id)}</b> ${esc(a.titre)}<span class="sub"> · ${esc(a.qui)} · ${lib}</span></span><span class="sub">${esc(NOM_ONG[ongletA(a)]||'')}</span></div>`;

const REP_MARGE_VENTE=7,REP_TAUX=0.23;
const mesuresSaisies=()=>{try{return JSON.parse(ETAT.evenements_mesures||'[]')}catch(e){return []}};
function verdictEv(m){const mv=m.ventes?m.marge/m.ventes:0,t=m.ht?m.marge/m.ht:0;
  if(!m.ventes)return ['⏳','À mesurer','var(--bleu)'];

  const ticks=[0,0.25,0.5,0.75,1].map(t=>mx*t);

   ${ticks.map(v=>`<line x1="${g}" x2="${W-d}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eceff1"/><text x="${g-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="#78909c">${k(v)}</text>`).join('')}
   ${ref!==null?`<line x1="${g}" x2="${W-d}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="#c62828" stroke-dasharray="4 4"/><text x="${W-d}" y="${Y(ref)-4}" font-size="9" text-anchor="end" fill="#c62828">référence ${k(ref)}</text>`:''}
   <polyline points="${pts}" fill="none" stroke="#2e7d32" stroke-width="2"/>

   ${lab}</svg><div class="sub" style="font-size:11px;color:var(--doux)">Masse salariale chargée par mois (€) — dernier point : ${eur(vals[vals.length-1])} (${moisFr(S[S.length-1][0])})</div>`;}

     ${rows.slice().reverse().map(r=>`<tr><td style="text-transform:capitalize">${moisFr(r.m)}</td><td class="n">${eur(r.ms)}</td><td class="n">${r.mg!==null?eur(r.mg):'<span class="sub">à charger</span>'}</td><td class="n ${r.mg&&r.ms/r.mg>0.5?'neg':''}">${r.mg?pct(r.ms/r.mg):'—'}</td><td class="n">${r.ca!=null?eur(r.ca):'—'}</td><td class="n">${r.ca?pct(r.ms/r.ca):'—'}</td></tr>`).join('')}</table></div>
     <div class="sub w" style="margin-top:6px">Marge et CA : onglet PERFORMANCE (mois N et N−1)${A&&A.margeMensuelle?' et historique Vindilis':''}. Les mois « à charger » seront complétés par l'export Vindilis (action A39).</div></div>`;
  } else {
    const V=A&&A.vendeurs;
    if(!V){h=`<div class="carte al o"><b class="t">Ventes par collaborateur : en cours d'extraction</b><div class="sub w">Source : Vindilis › Statistiques › Vendeurs (ventes, CA, marge, panier), avec la séparation ordonnance / sans ordonnance. Voir action A38.</div></div>`}
    else{const per=V.periodes;h=per.map(pr=>{
      const cost=n=>{const tk=sansAcc(n).split(/\s+/);const nm=[...new Set(P.map(r=>r.c))].find(c=>tk.includes(sansAcc(c)));if(!nm)return null;const L=P.filter(r=>r.c===nm&&r.m>=pr.du.slice(0,7)+'-01'&&r.m<=pr.au);return L.length?{k:L.reduce((s,r)=>s+r.k,0),h:L.reduce((s,r)=>s+r.h,0),nm}:null};
      const L=pr.lignes.map(x=>({...x,c:cost(x.nom)})).sort((a,b)=>b.margeLibre-a.margeLibre);
      return `<div class="carte"><b>${esc(pr.libelle)}</b><div class="kpis" style="margin-top:8px;grid-template-columns:repeat(3,1fr)"><div><div class="sub">Ventes</div><b>${ent(pr.total.ventes)}</b></div><div><div class="sub">Marge totale</div><b>${eur(pr.total.marge)}</b></div><div><div class="sub">dont sans ordonnance</div><b>${eur(pr.total.margeLibre)}</b> <span class="sub">(${pct(pr.total.margeLibre/pr.total.marge)})</span></div></div><div class="sub w" style="margin-top:6px">${esc(pr.source)}</div></div>
       <div class="chart2"><div class="carte"><b>Marge : avec ou sans ordonnance</b>${donut([['Avec ordonnance',Math.round(pr.total.marge-pr.total.margeLibre),'var(--bleu)',null,eur(pr.total.marge-pr.total.margeLibre)],['Sans ordonnance (conseil, para.)',Math.round(pr.total.margeLibre),'var(--vert2)',null,eur(pr.total.margeLibre)]],pct(pr.total.margeLibre/pr.total.marge),'sans ordonnance')}</div>
       <div class="carte"><b>Marge par collaborateur</b>${barresH(L.slice(0,14).map(x=>[x.nom,[[x.margeLibre,'var(--vert2)','sans ordonnance'],[Math.max(0,x.marge-x.margeLibre),'var(--bleu)','avec ordonnance']],'',eur(x.marge)]))}${legende([['Sans ordonnance','var(--vert2)'],['Avec ordonnance','var(--bleu)']])}</div></div>
       <div class="carte"><b>Classement sur la marge sans ordonnance (conseil, parapharmacie)</b><div class="tw"><table class="t"><tr><th>Collaborateur</th><th class="n">Ventes</th><th class="n">Marge totale</th><th class="n">Marge sans ordo.</th><th class="n">Part sans ordo.</th><th class="n">Marge / vente sans ordo.</th><th class="n">Coût employeur</th><th class="n">Marge sans ordo. / heure payée</th></tr>
       ${L.map(x=>`<tr><td><b>${esc(x.nom)}</b></td><td class="n">${ent(x.ventes)}</td><td class="n">${eur(x.marge)}</td><td class="n"><b>${eur(x.margeLibre)}</b></td><td class="n">${x.marge?pct(x.margeLibre/x.marge):'—'}</td><td class="n">${x.ventesLibre?eur2(x.margeLibre/x.ventesLibre):'—'}</td><td class="n">${x.c?eur(x.c.k):'<span class="sub">—</span>'}</td><td class="n">${x.c&&x.c.h?eur2(x.margeLibre/x.c.h):'—'}</td></tr>`).join('')}</table></div>
       <div class="sub w" style="margin-top:6px">Coût employeur et heures : bulletins de paie de la même période (rapprochement par le prénom). « — » : pas de bulletin trouvé (titulaire, intérimaire, stagiaire, ou prénom différent).</div></div>`}).join('')+
       `<div class="carte al"><b class="t">Bien lire ces chiffres</b><div class="sub w">La marge d'une ordonnance dépend du médecin, pas du vendeur : on juge un collaborateur surtout sur le <b>sans ordonnance</b> (conseil, parapharmacie, panier) et sur la marge par vente. Les postes (caisse rapide, ordonnances, réception) ne sont pas comparables entre eux : comparer des personnes au même poste.</div></div>`}
  }
  $('#m').innerHTML=nav+h+`<button class="btn sec" id="lock" style="margin-top:6px">🔒 Verrouiller</button>`;bind();
  const vm=document.getElementById('vMois');if(vm)vm.onclick=()=>equipe();
  $('#lock').onclick=()=>{ss.del('pil_code2');PAIE=null;collaborateurs();toast('Détail RH verrouillé')};
}

async function chargerPaie(code2){
  const c=cfg();
  try{const r=await fetch(c.url+'?code='+encodeURIComponent(c.code)+'&action=rh&code2='+encodeURIComponent(code2)+'&t='+Date.now());const j=await r.json();
    if(!j.ok){toast(j.err||'Erreur');ss.del('pil_code2');return false} PAIE=j.paie||[]; return true}
  catch(e){toast('Réseau indisponible');return false}
}

function fab(fn){let f=$('.fab'); if(f)f.remove(); if(!fn)return; f=document.createElement('button'); f.className='fab'; f.textContent='+'; f.onclick=fn; document.body.appendChild(f)}

/* ---------- Formulaire générique (champs saisissables uniquement) ---------- */
const LISTES={'Mise en place':'Oui / Non','Politique prix':'Politique prix','Statut prix':'Statut prix','Promo en cours':'Oui / Non','Type':"Type d'emplacement",'Zone / univers':'Zone / univers','Univers':'Zone / univers','Plateforme':'Plateforme écran','Position':'Position écran'};
const DATES=['Date repricing','Début','Fin','Préparer dès','Date export'];
const PCTS=['Remise avant %','Remises arrière % (info)'];
const NUMS=['Couverture stock (mois)','Commander sous (jours)','CA HT 12 mois','Marge € 12 mois','Marge € générée (période)','CA HT N','CA HT N-1','Marge € N','Marge € N-1','Ventes Vindilis N','Recyclage N','Ventes Vindilis N-1','Recyclage N-1','Objectif marge €'];
const CLES={OPERATIONS:'ID',LABORATOIRES:'Laboratoire',SURFACE_VENTE:'Code emplacement',ECRANS:'Code écran',PERFORMANCE:'Mois',CALENDRIER:'Événement',COMMANDES:'Laboratoire',EQUIPE:'Collaborateur',PRODUITS_ECRANS:'EAN'};
function formulaire(sheet,x){
  const champs=D.schema[sheet], cle=CLES[sheet], neuf=!x; x=x||{};
  $('#ht').textContent=neuf?'Nouveau':String(sheet==='PERFORMANCE'?moisFr(x[cle]):x[cle]);
  const champ=h=>{
    const v=x[h]??'', id='f_'+champs.indexOf(h), ro=(!neuf&&h===cle)?'disabled':'';
    if(h==='Laboratoire'&&sheet!=='LABORATOIRES') return `<label>${h}</label><select id="${id}" ${ro}><option value=""></option>${D.labos.map(l=>`<option ${l['Laboratoire']===v?'selected':''}>${esc(l['Laboratoire'])}</option>`).join('')}${v&&!D.labos.some(l=>l['Laboratoire']===v)?`<option selected>${esc(v)}</option>`:''}</select>`;
    if(LISTES[h]){const o=(D.refs[LISTES[h]]||[]); return `<label>${h}</label><select id="${id}"><option value=""></option>${o.map(s=>`<option ${s===v?'selected':''}>${esc(s)}</option>`).join('')}${v&&!o.includes(v)?`<option selected>${esc(v)}</option>`:''}</select>`}
    if(h==='Mois') return `<label>${h}</label><input id="${id}" type="month" value="${esc(isoMois(v).slice(0,7))}" ${ro}>`;
    if(DATES.includes(h)) return `<label>${h}</label><input id="${id}" type="date" value="${esc(v)}">`;
    if(PCTS.includes(h)) return `<label>${h} (en %)</label><input id="${id}" type="number" step="0.1" inputmode="decimal" value="${num(v)===null?'':+(v*100).toFixed(2)}">`;
    if(NUMS.includes(h)) return `<label>${h}</label><input id="${id}" type="number" step="any" inputmode="decimal" value="${esc(v)}">`;
    if(h==='Commentaire'||h==='Ordre de préparation'||h==='Catégories') return `<label>${h}</label><textarea id="${id}" rows="2">${esc(v)}</textarea>`;
    return `<label>${h}</label><input id="${id}" value="${esc(v)}" ${ro}>`;
  };
  const aide=sheet==='PERFORMANCE'?'<p class="sub" style="font-size:12px;color:var(--doux)">Ventes = colonne « Ventes » du comparatif jour Vindilis ; le recyclage est déduit deux fois automatiquement.</p>':'';
  $('#m').innerHTML=`<button class="btn sec" id="ret" style="margin:0 0 10px">← Retour</button><div class="carte">${aide}${champs.map(champ).join('')}
   <button class="btn" id="env">Enregistrer</button></div>`;
  $('#ret').onclick=()=>rendre(); fab(null);
  $('#env').onclick=async()=>{
    const row={};
    champs.forEach((h,i)=>{const e=$('#f_'+i); if(!e)return; let v=e.value.trim();
      if(h==='Mois'&&v)v=v+'-01';
      else if(PCTS.includes(h))v=v===''?'':Math.round(parseFloat(v.replace(',','.'))*100)/10000;
      else if(NUMS.includes(h))v=v===''?'':parseFloat(v.replace(',','.'));
      row[h]=v;});
    if(!row[cle]){toast('« '+cle+' » est obligatoire');return}
    if(PCTS.some(h=>(h in row)&&row[h]!==''&&(isNaN(row[h])||row[h]<0||row[h]>1))){toast('Remise : entre 0 et 100 %');return}
    if(NUMS.some(h=>(h in row)&&row[h]!==''&&isNaN(row[h]))){toast('Nombre invalide');return}
    $('#env').disabled=true; $('#env').textContent='Enregistrement…';
    if(await poster({action:'upsert',sheet,row})){toast('Enregistré — recommandations recalculées');await charger(true)}
    else{$('#env').disabled=false;$('#env').textContent='Enregistrer'}
  };
}

(function(){try{const q=new URLSearchParams(location.search),sh=q.get('ouvrir'),k=q.get('cle');if(!D||!sh||!k)return;

  history.replaceState(null,'','index.html');}catch(e){}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
